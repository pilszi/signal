    <script>
        (function checkAuth() {
            // 1. 세션 스토리지에서 아이디 확인
            const savedUserId = sessionStorage.getItem("savedUserId");
            
            // 2. 로그인 여부 판단 (값이 없거나 'guest'인 경우)
            if (!savedUserId || savedUserId === "guest" || savedUserId === "null") {
                // 로그인 안 됨: 경고창을 띄우고 로그인 페이지로 이동
                alert("로그인 후 이용해주세요.");
                location.href = "login.html";
                
                // 페이지 본문이 보이지 않도록 즉시 중단 (일종의 가드)
                document.documentElement.style.display = 'none';
            }
        })();
    </script>

    <style>
        .notif-container {
                position: relative;
                display: inline-block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
        .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */
                position: relative;
                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */
            .notif-footer {
                padding: 12px;
                text-align: center;
                background-color: #f9fafb;
            }

            .all-read-btn {
                background: none;
                border: none;
                color: #2563eb;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }

            .all-read-btn:hover { text-decoration: underline; }
    </style>

    <!-- 뉴스 상세 분석 모달 (Gemini 리포트 노출용) -->

                <button onclick="closeNewsModal()" class="w-24 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition-colors">닫기</button>
            </div>

    <script>
        // 전역 변수 설정
        let newsData = []; // 백엔드 실시간 데이터 저장소
        let selectedKeyword = null;
        let myNotifs = [
            { id: 1, type: "signal", title: "3단계 위험 시그널", message: "이란 석유 수출 관련 높은 위험도 감지", time: "5분 전", isRead: false },
            { id: 2, type: "keyword", title: "키워드 알림: 반도체", message: "중국 반도체 관련 새로운 뉴스가 등록되었습니다", time: "1시간 전", isRead: false },
            { id: 3, type: "signal", title: "3단계 위험 시그널", message: "우크라이나 곡물 수출 중단 감지", time: "2시간 전", isRead: false },
            { id: 4, type: "profile", title: "개인정보 수정 완료", message: "프로필 정보가 성공적으로 업데이트되었습니다", time: "3시간 전", isRead: true }
        ];

        // 데이터 연동 핵심 함수 (백엔드 API 호출)
        async function fetchNews() {
            try {
                const res = await axios.get('/api/risk-signals');
                const rawData = res.data.data;

                // 백엔드 데이터를 프론트엔드 형식에 맞게 가공 (매핑 로직 포함)
                newsData = rawData.map((item, index) => {
                    const levelMap = { "심각": 3, "주의": 2, "안정": 1 };
                    return {
                        id: index,
                        title: item.title,
                        media: item.press_name,
                        imageUrl: item.main_image || `https://picsum.photos/seed/${index}/400/250`,
                        analysisTime: item.analyzed_at,
                        url: item.url,
                        // 백엔드 -1~1 점수를 0~100점으로 정규화
                        riskScore: Math.round((item.final_total_score.total + 1) * 50),
                        riskLevel: levelMap[item.risk_level] || 1,
                        customKeyword: item.keywords[0] || "Global",
                        isRead: false,
                        prediction: item.prediction,
                        prediction_reason: item.prediction_reason
                    };
                });
                render(); // 가공된 데이터로 화면 렌더링
            } catch (e) {
                console.error("뉴스 로드 실패:", e);
                // 에러 시 빈 화면이 되지 않도록 기본 메시지 처리 가능
            }
        }

        // 모달 제어 함수
        function openNewsModal(news) {
            document.getElementById('modal-title').innerText = news.title;
            document.getElementById('modal-prediction').innerText = news.prediction;
            document.getElementById('modal-reason').innerText = news.prediction_reason;
            document.getElementById('modal-url').href = news.url; // URL 연결
            document.getElementById('news-modal').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeNewsModal() {
            document.getElementById('news-modal').classList.add('hidden');
        }

        // 뉴스 카드 컴포넌트 생성
        function createNewsCard(news, index) {
            const riskColors = {
                1: "bg-blue-100 text-blue-700",
                2: "bg-yellow-100 text-yellow-700",
                3: "bg-red-100 text-red-700"
            };

            return `
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition-all cursor-pointer relative ${news.isRead ? 'opacity-75' : ''}"
                 onclick='handleCardClick(${index})'>
                <img src="${news.imageUrl}" alt="news" class="w-full h-48 object-cover">
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-2 py-1 text-xs font-semibold rounded ${riskColors[news.riskLevel] || 'bg-gray-100'}">
                            Signal ${news.riskScore}
                        </span>
                        <span class="text-xs text-blue-600 font-medium">#${news.customKeyword}</span>
                    </div>
                    <h3 class="font-bold text-lg mb-2 line-clamp-2">${news.title}</h3>
                    <div class="flex justify-between items-center mt-4">
                        <span class="text-sm text-gray-500">${news.media}</span>
                        <span class="text-xs text-gray-400">${news.analysisTime.split('T')[0]}</span>
                    </div>
                </div>
                ${!news.isRead ? '<div class="absolute top-2 right-2 w-3 h-3 bg-blue-500 rounded-full border-2 border-white"></div>' : ''}
            </div>
        `;
    }

        // 카드 클릭 시 읽음 처리 및 모달 오픈
        window.handleCardClick = (index) => {
            const news = newsData[index]; // 인덱스로 데이터 찾기
            news.isRead = true;
            openNewsModal(news);
            render(); // 읽음 상태 반영을 위해 다시 렌더링
        };

        // 필터링 및 리스트 렌더링
        function render() {
            const filterContainer = document.getElementById('keyword-filters');
            const newsGrid = document.getElementById('news-grid');
            const statsText = document.getElementById('stats-text');

            // 1. 데이터 기반 키워드 필터 생성
            const currentKeywords = Array.from(new Set(newsData.map(n => n.customKeyword)));
            filterContainer.innerHTML = '<i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>';

            const allBtn = document.createElement('button');
            allBtn.innerText = '전체';
            allBtn.className = `px-4 py-2 rounded-lg transition-colors ${selectedKeyword === null ? "bg-gray-900 text-white" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`;
            allBtn.onclick = () => { selectedKeyword = null; render(); };
            filterContainer.appendChild(allBtn);

            currentKeywords.forEach(kw => {
                const btn = document.createElement('button');
                btn.innerText = kw;
                btn.className = `px-4 py-2 rounded-lg transition-colors ${selectedKeyword === kw ? "bg-blue-500 text-white" : "bg-blue-50 text-blue-600 hover:bg-blue-100"}`;
                btn.onclick = () => { selectedKeyword = kw; render(); };
                filterContainer.appendChild(btn);
            });

            // 2. 필터링 및 정렬 (읽지 않음 -> 점수 순 -> 최신 순)
            const filtered = newsData.filter(n => !selectedKeyword || n.customKeyword === selectedKeyword);
            const sorted = [...filtered].sort((a, b) => {
                if (a.isRead !== b.isRead) return a.isRead ? 1 : -1;
                if (a.riskScore !== b.riskScore) return b.riskScore - a.riskScore;
                return new Date(b.analysisTime) - new Date(a.analysisTime);
            });

            // 3. 그리드 갱신
            newsGrid.innerHTML = sorted.map((news, idx) => createNewsCard(news, idx)).join('');

            // 4. 하단 통계 갱신
            const unreadCount = sorted.filter(n => !n.isRead).length;
            statsText.innerText = `${sorted.length}개의 뉴스 · 읽지 않은 뉴스 ${unreadCount}개`;

            if (window.lucide) lucide.createIcons();
        }

        // --- 공통 기능 (Navbar, 알림, 인증 등 기존 로직 100% 보존) ---

        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            if (!authContainer) return;
            const userNameSpan = document.getElementById('user_name');
            const loggedInId = sessionStorage.getItem('savedUserId');
            const userGreeting = document.getElementById('user-greeting');

            if (loggedInId && loggedInId !== 'guest' && loggedInId !== 'null') {
                if (userGreeting && userNameSpan) {
                    userNameSpan.textContent = loggedInId;
                    userGreeting.classList.remove('hidden');
                }
                authContainer.innerHTML = `<button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">LOG OUT</button>`;
            } else {
                if (userGreeting) userGreeting.classList.add('hidden');
                authContainer.innerHTML = `<a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">LOG IN</a>`;
            }
            if (window.lucide) lucide.createIcons();
        }

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")){
                try {
                    await axios.get("/logout");
                    sessionStorage.removeItem('savedUserId');
                    location.href = "login.html";
                } catch (e) { console.error(e); }
            }
        }

        function updateNotifUI() {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const countText = document.getElementById('notifCountText');
            const savedUserId = sessionStorage.getItem("savedUserId");

            if (!savedUserId || savedUserId === "guest") {
                badge.style.display = 'none';
                countText.innerText = '0개의 새 알림';
                list.innerHTML = `<div class="p-10 text-center text-gray-400 text-sm">로그인 후 알림을 확인하세요.</div>`;
                return;
            }

            const unreads = myNotifs.filter(n => !n.isRead);
            if (unreads.length > 0) {
                badge.innerText = unreads.length;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            countText.innerText = `${unreads.length}개의 새 알림`;
            renderNotifList(list);
        }

        function renderNotifList(container) {
            if (myNotifs.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-400">알림이 없습니다.</div>';
                return;
            }
            container.innerHTML = myNotifs.map(n => {
                const icon = n.type === 'signal' ? 'alert-triangle' : (n.type === 'keyword' ? 'tag' : 'user');
                const color = n.type === 'signal' ? '#ef4444' : (n.type === 'keyword' ? '#3b82f6' : '#6b7280');
                return `
                    <div class="notif-item ${n.isRead ? '' : 'unread'}" onclick="readNotif(${n.id}, '${n.type}')">
                        <div class="flex-shrink-0 pt-1"><i data-lucide="${icon}" style="color: ${color}; width: 18px; height: 18px;"></i></div>
                        <div class="flex-1">
                            <div class="text-sm font-semibold text-gray-800">${n.title}</div>
                            <div class="text-xs text-gray-500 mt-1">${n.message}</div>
                            <div class="text-[10px] text-gray-400 mt-2">${n.time} ${n.isRead ? '' : '<span class="unread-dot inline-block ml-1"></span>'}</div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function readNotif(id, type) {
            myNotifs = myNotifs.map(n => n.id === id ? {...n, isRead: true} : n);
            updateNotifUI();
            const routes = { 'signal': 'signal_log.html', 'keyword': 'custom_news.html', 'profile': 'profile.html' };
            location.href = routes[type] || 'main.html';
        }

        // 초기화 및 이벤트 바인딩
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbar();
            updateNotifUI();
            fetchNews(); // 실시간 데이터 로드

            // 알림창 토글
            const trigger = document.getElementById('notifTrigger');
            const dropdown = document.getElementById('notifDropdown');
            trigger.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); };
            document.onclick = (e) => { if (!document.getElementById('notifContainer').contains(e.target)) dropdown.classList.add('hidden'); };

            // 현재 경로 활성화 표시 (기존 스타일링 유지)
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.nav-item').forEach(item => {
                const itemHref = item.getAttribute('href').split("/").pop();
                if (currentPath === itemHref) {
                    item.classList.add('bg-blue-50', 'text-blue-600', 'font-bold');
                    item.classList.remove('text-gray-600');
                }
            });

            axios.get("/session_out"); // 세션 갱신/체크용
        });
    </script>
    <style>
        .stretched-link::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            content: "";
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</body>
</html>
