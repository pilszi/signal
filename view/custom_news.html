        (function checkAuth() {
            // 1. 세션 스토리지에서 아이디 확인
            const savedUserId = sessionStorage.getItem("savedUserId");
            
            // 2. 로그인 여부 판단 (값이 없거나 'guest'인 경우)

                document.documentElement.style.display = 'none';

        })();

            .hidden { display: none; }

            /* 헤더 */

                justify-content: space-between;

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }

            /* 알림 목록 */

            .notif-item {

            /* 아이콘 박스 */

                border-radius: 8px;

                justify-content: center;

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold mb-2 text-gray-900">맞춤형 뉴스</h1>
            <p class="text-gray-600">관심 키워드에 맞는 뉴스를 확인하세요</p>
        </div>

        <div class="mb-6">
            <div id="keyword-filters" class="flex items-center gap-3 flex-wrap">
                <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                </div>
        </div>

        <div class="mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <p id="stats-text" class="text-sm text-gray-500">
                </p>
            <div class="flex items-center gap-2">
                <span class="text-sm text-gray-500">정렬:</span>
                <span class="text-sm font-medium text-gray-700 bg-white px-2 py-1 rounded border">읽지 않음 → Signal 점수 → 최신순</span>
            </div>
        </div>

        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
        <!-- 페이지네이션 -->
        <div id="pagination" class="mt-8 flex items-center justify-center gap-2">
            <!-- JS에서 생성 -->
        </div>
    </div>

    <script>
        // 1. 상태 관리 변수
        let savedUserId = sessionStorage.getItem("savedUserId");
        let allSignals = [];      // 서버에서 가져온 전체 뉴스
        let filteredSignals = [];  // 키워드 필터 및 정렬이 적용된 뉴스
        let noti = [];            // 알림 데이터
        let selectedKeyword = null;
        let currentPage = 1;
        const SIGNALS_PER_PAGE = 12; // 3열 그리드 최적화

        // 2. 데이터 가져오기 통합 (맞춤 뉴스 + 알림 데이터)
        async function refreshCustomData() {
            try {
                const [newsRes, notiRes] = await Promise.all([
                    axios.get('/custom_news?id=' + savedUserId),
                    axios.get("/noti/signal?id=" + savedUserId)
                ]);

                allSignals = newsRes.data.news;
                noti = notiRes.data.noti;

                // 키워드 필터 버튼 생성 (최초 1회 및 갱신 시)
                renderKeywordFilters(newsRes.data.keyword);

                // 뉴스 그리드 및 알림 UI 업데이트
                applyFilterAndSort();
                updateNotifUI_Static();

            } catch (error) {
                console.error("데이터 동기화 실패:", error);
            }
        }

        // 3. 키워드 필터 버튼 렌더링
        function renderKeywordFilters(keywords) {
            const container = document.getElementById('keyword-filters');
            if (!container) return;

            container.innerHTML = '<i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>';

            // '전체' 버튼과 개별 키워드 버튼들 생성
            const allKeywords = [null, ...keywords];
            allKeywords.forEach(kw => {
                const btn = document.createElement('button');
                btn.innerText = kw || '전체';

                const isActive = selectedKeyword === kw;
                btn.className = `px-4 py-2 rounded-lg transition-colors text-sm font-medium ${
                    isActive
                    ? "bg-blue-600 text-white shadow-md"
                    : "bg-white text-gray-600 hover:bg-blue-50 border border-gray-200"
                }`;

                btn.onclick = () => {
                    selectedKeyword = kw;
                    currentPage = 1; // 필터 변경 시 1페이지로 리셋
                    applyFilterAndSort();
                    renderKeywordFilters(keywords); // 버튼 선택 상태 업데이트
                };
                container.appendChild(btn);
            });
            if (window.lucide) lucide.createIcons();
        }

        // 4. 필터링, 정렬 및 렌더링 엔진
        function applyFilterAndSort() {
            const newsGrid = document.getElementById('news-grid');
            const statsText = document.getElementById('stats-text');

            // [Step 1] 키워드 필터링
            filteredSignals = allSignals.filter(n => !selectedKeyword || n.keyword === selectedKeyword);

            // [Step 2] 정렬 로직: 1.읽지 않음 우선 -> 2.위험점수(절대값) 높은순 -> 3.최신순
            filteredSignals.sort((a, b) => {
                const readA = !!a.is_read;
                const readB = !!b.is_read;
                if (readA !== readB) return readA ? 1 : -1;

                const scoreA = Math.abs(a.risk_score || 0);
                const scoreB = Math.abs(b.risk_score || 0);
                if (scoreB !== scoreA) return scoreB - scoreA;

                return new Date(b.published_date) - new Date(a.published_date);
            });

            // [Step 3] 페이지네이션 데이터 슬라이스
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const currentSignals = filteredSignals.slice(startIndex, startIndex + SIGNALS_PER_PAGE);

            // [Step 4] 화면 출력
            if (currentSignals.length === 0) {
                newsGrid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-400">표시할 뉴스가 없습니다.</div>';
            } else {
                newsGrid.innerHTML = currentSignals.map(news => createNewsCard(news)).join('');
            }

            // [Step 5] 통계 텍스트 업데이트
            const unreadCount = filteredSignals.filter(n => !n.is_read).length;
            statsText.innerText = `${filteredSignals.length}개의 뉴스 · 읽지 않은 뉴스 ${unreadCount}개`;

            renderPagination();
            if (window.lucide) lucide.createIcons();
        }

        // 5. 뉴스 카드 UI 생성
        function createNewsCard(news) {
            const riskColors = {
                "안정": "bg-blue-100 text-blue-700",
                "주의": "bg-yellow-100 text-yellow-700",
                "심각": "bg-red-100 text-red-700"
            };

            const displayScore = Math.round(Math.abs(news.risk_score || 0) * 100);
            const isRead = !!news.is_read;

            return `
                <div class="bg-white rounded-xl shadow-sm border ${isRead ? 'opacity-75' : 'border-blue-200'} overflow-hidden hover:shadow-md transition-all group cursor-pointer h-full relative" onclick="logNewsClick('${news.url}')">
                    ${!isRead ? '<div class="absolute top-3 right-3 w-3 h-3 bg-blue-500 rounded-full border-2 border-white z-10"></div>' : ''}
                    <div class="relative h-48 overflow-hidden">
                        <img src="${news.main_image || '/api/placeholder/400/320'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 left-2">
                            <span class="px-2 py-1 text-[10px] font-bold rounded shadow-sm ${riskColors[news.risk_level] || 'bg-gray-100'}">
                                Signal ${displayScore}
                            </span>
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-blue-600 uppercase">#${news.keyword}</span>
                            <span class="text-[11px] text-gray-400">${timeAgo(news.published_date)}</span>
                        </div>
                        <h3 class="font-bold leading-tight text-gray-900 group-hover:text-blue-600 transition-colors line-clamp-2 mb-4">
                            ${news.title}
                        </h3>
                        <div class="flex items-center gap-2 border-t pt-3">
                            <span class="text-xs font-medium text-gray-500">${news.press_name}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 6. 알림 드롭다운 및 배지 업데이트
        function updateNotifUI_Static() {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const countText = document.getElementById('notifCountText');
            // 1. 로그인 여부 확인 (React 코드의 로직 반영)

            const {data} = await axios.get("/noti/signal?id="+savedUserId);
            console.log(data);
            noti = data.noti;
            // 로그인 정보가 없거나 guest인 경우 알림 목록을 표시하지 않음
            if (!savedUserId || savedUserId === "guest") {
                badge.style.display = 'none'; // 배지 숨김
                countText.innerText = '0개의 새 알림';
                list.innerHTML = `
                    <div style="padding: 40px; text-align: center;">
                        <p style="color: #9ca3af; font-size: 14px;">로그인 후 알림을 확인하세요.</p>
                    </div>`;
                return;
            }

            const unreads = noti.filter(n => !n.is_read);

            if (unreads.length > 0) {
                badge.innerText = unreads.length;
                badge.style.display = 'flex'; // 로그인 + 새 알림 있음 -> 표시
            } else {
                badge.style.display = 'none'; // 로그인 + 새 알림 없음 -> 숨김
            }

            if (countText) countText.innerText = `${unreads.length}개의 새 알림`;
            renderList(list, noti);
        }

        // 7. 알림 리스트 렌더링 (드롭다운)
        function renderList(container, data) {
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-400">알림이 없습니다.</div>';
                return;
            }
            container.innerHTML = data.map(n => `
                <div class="notif-item p-4 border-b relative ${n.is_read ? '' : 'bg-blue-50 hover:bg-blue-100'}" onclick="readItem(${n.signal_no})">
                    <div class="text-xs font-bold ${n.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} mb-1">${n.risk_level} 단계 알림</div>
                    <div class="text-sm text-gray-800 mb-1 pr-6">${n.prediction}</div>
                    <div class="text-[10px] text-gray-400">${timeAgo(n.signal_time)}</div>
                    <button onclick="deleteItem(event, ${n.signal_no})" class="absolute right-2 top-4 p-1 text-gray-300 hover:text-gray-500">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('') + `
                <div class="p-3 text-center bg-gray-50">
                    <button onclick="allRead()" class="text-xs text-blue-600 hover:underline">모두 읽음으로 처리</button>
                </div>`;
            if (window.lucide) lucide.createIcons();
        }

        // 8. 알림 상호작용 및 서버 통신
        async function readItem(id) {
            await axios.post("/noti/read", { "id": id, "user_id": savedUserId });
            location.href = 'signal_log.html';
        }

        async function deleteItem(e, id) {
            e.stopPropagation();
            noti = noti.filter(n => n.signal_no !== id);
            await axios.post("/noti/read", { "id": id, "user_id": savedUserId });
            updateNotifUI_Static();
        }

        async function allRead() {
            await axios.get("/noti/read_all?id=" + savedUserId);
            refreshCustomData();
        }

        // 3. 뉴스 카드 컴포넌트 (Template Function)
        function createNewsCard(news) {
            const riskColors = {
                "안정": "bg-blue-100 text-blue-700",
                "주의": "bg-yellow-100 text-yellow-700",
                "심각": "bg-red-100 text-red-700"
            };
            const displayScore = Math.round(Math.abs(100-(news.risk_score || 0) * 100));

            let newBadge = '';
            if (!news.is_read) {
                newBadge = '<div class="absolute top-2 right-2 w-3 h-3 bg-blue-500 rounded-full border-2 border-white"></div>';
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition-shadow group cursor-pointer h-full relative" onclick="logNewsClick('${news.url}')">
                    <a href=${news.url} target="_blank">
                        <img src="${news.main_image}" alt="news" class="w-full h-48 object-cover">
                    </a>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-1 text-xs font-semibold rounded ${riskColors[news.risk_level] || 'bg-gray-100'}">
                                Signal ${news.displayScore}
                            </span>
                            <span class="text-xs text-blue-600 font-medium">${news.keyword}</span>
                        </div>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-sm text-gray-500 h-8">${news.press_name}</span>
                            <span class="text-xs text-gray-400 h-8">${news.published_date.split('T')[0]}</span>
                            </div>
                        <a href=${news.url} target="_blank" class="font-bold leading-tight group-hover:text-blue-600 transition-colors">${news.title}</a>
                    </div>
                    ${newBadge}
                </div>
            `;
        }

        // 4. 필터 및 정렬 렌더링 함수
        async function render() {
            const filterContainer = document.getElementById('keyword-filters');
            const newsGrid = document.getElementById('news-grid');
            const statsText = document.getElementById('stats-text');

            let {data} = await axios.get("/custom_news?id="+savedUserId);
            console.log(data);
            allSignals = data.news
            // 필터 버튼 생성
            filterContainer.innerHTML = '<i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>';
            
            // '전체' 버튼
            const allBtn = document.createElement('button');
            allBtn.innerText = '전체';
            // 1. 기본 공통 스타일 설정
            let classNames = "px-4 py-2 rounded-lg transition-colors";

            // 2. 조건에 따른 스타일 분기 (if문)
            if (selectedKeyword === null) {
                // '전체'가 선택된 상태 (강조)
                classNames += " bg-gray-900 text-white";
            } else {
                // 다른 키워드가 선택된 상태 (비활성화 느낌)
                classNames += " bg-gray-100 text-gray-700 hover:bg-gray-200";
            }

            allBtn.className = classNames;
            allBtn.onclick = () => { 
                selectedKeyword = null; 
                render(); 
            };
            filterContainer.appendChild(allBtn);

            // 개별 키워드 버튼
            data.keyword.forEach(kw => {
                const btn = document.createElement('button');
                btn.innerText = kw;
                let className = 'px-4 py-2 rounded-lg transition-colors';

                if (selectedKeyword === kw){
                    className += " bg-blue-500 text-white";
                }else{
                    className += " bg-blue-50 text-blue-600 hover:bg-blue-100"
                }
                btn.onclick = () => { 
                    selectedKeyword = kw; 
                    render(); 
                };
                btn.className = className;
                filterContainer.appendChild(btn);
            });

            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const endIndex = startIndex + SIGNALS_PER_PAGE;
            const currentSignals = allSignals.slice(startIndex, endIndex);

            // 필터링 및 정렬 로직
            const filtered = currentSignals.filter(n => !selectedKeyword || n.keyword === selectedKeyword);
            const sorted = [...filtered].sort((a, b) => {
                // 1. 읽음 상태 기준 정렬 (읽지 않은 기사 !is_read 가 위로 오도록)
                const readA = !!a.is_read; 
                const readB = !!b.is_read;
                if (readA !== readB) {
                    if (readA) {
                        return 1;  // a가 읽은 상태면 뒤로 보냄
                    } else {
                        return -1; // a가 읽지 않은 상태면 앞으로 보냄
                    }
                }
                // 2. 리스크 점수 기준 정렬 (높은 점수가 위로)
                if (a.risk_score !== b.risk_score) {
                    return a.risk_score - b.risk_score;
                }
                // 3. 날짜 기준 정렬 (최신순)
                const dateA = new Date(a.published_date);
                const dateB = new Date(b.published_date);
                return dateB - dateA;

                renderPagination();
            });

            // 뉴스 그리드 채우기
            newsGrid.innerHTML = sorted.map(news => createNewsCard(news)).join('');
            
            // 통계 갱신
            const unreadCount = sorted.filter(n => !n.is_read).length;
            statsText.innerText = `${sorted.length}개의 뉴스 · 읽지 않은 뉴스 ${unreadCount}개`;

            lucide.createIcons();
        }

        // 📡 기사 클릭 로그를 서버로 전송하는 함수
        async function logNewsClick(articleUrl) {
            if (savedUserId) {
                await axios.post("/news_view", { id: savedUserId, url: articleUrl });
                window.open(articleUrl, '_blank');
                refreshCustomData(); // 읽음 상태 즉시 반영을 위해 새로고침
            }
        }

        // 9. 유틸리티 및 페이지네이션
        function timeAgo(dateString) {
            const diff = Math.floor((new Date() - new Date(dateString)) / 1000);
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
            return dateString.split('T')[0];
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!container) return;
            const totalPages = Math.ceil(filteredSignals.length / SIGNALS_PER_PAGE);

            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button onclick="handlePageChange(${currentPage-1})" ${currentPage===1?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage===i?'bg-blue-600 text-white':'hover:bg-gray-50'}">${i}</button>`;
            }
            html += `<button onclick="handlePageChange(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>`;
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        function handlePageChange(page) {
            currentPage = page;
            applyFilterAndSort();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            const userNameSpan = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');
            if (savedUserId && savedUserId !== 'guest' && savedUserId !== 'null') {
                if (userNameSpan) userNameSpan.textContent = savedUserId;
                if (userGreeting) userGreeting.classList.remove('hidden');
                authContainer.innerHTML = `<button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase">LOG OUT</button>`;
            } else {
                if (userGreeting) userGreeting.classList.add('hidden');
                authContainer.innerHTML = `<a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase">LOG IN</a>`;
            }
        }

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                await axios.get("/logout");
                sessionStorage.clear();
                location.href = "login.html";
            }
        }

        // 10. 초기화 및 실시간 감시 (30초 폴링)
        document.addEventListener('DOMContentLoaded', async () => {
            updateNavbar();
            axios.get("/session_out");

            // 첫 데이터 로드
            await refreshCustomData();

            // 30초마다 맞춤형 뉴스 실시간 업데이트
            setInterval(async () => {
                console.log("🔄 맞춤형 뉴스 자동 동기화 중...");
                await refreshCustomData();
            }, 30000);

            // 네비바 하이라이트
            const currentPath = window.location.pathname.split("/").pop() || "custom_news.html";
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('href').split("/").pop() === currentPath) {
                    item.classList.add('bg-blue-50', 'text-blue-600');
                }
            });

            // 알림창 토글 제어
            const trigger = document.getElementById('notifTrigger');
            const dropdown = document.getElementById('notifDropdown');
            if (trigger && dropdown) {
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!document.getElementById('notifContainer').contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });

    </script>

    <style>
        .stretched-link::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            content: "";
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
