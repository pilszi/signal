        function getCleanImageUrl(url) {
            const defaultImg = '/static/img/signal_image.png';

            if (!url || typeof url !== 'string' || url.trim() === '') return defaultImg;
            let finalUrl = url.trim();

            // 1. [핵심] 유명 뉴스/이미지 도메인은 확장자 체크 없이 즉시 통과
            // yimg(야후), mktw(마켓워치), pstatic/naver(네이버), cloudfront(CDN) 등
            const trustedDomains = /yimg\.com|mktw\.net|pstatic\.net|naver\.net|newsimg|cloudfront\.net|api\/res/i;

            if (trustedDomains.test(finalUrl)) {
                return finalUrl;
            }

            // 2. 중복 프로토콜 수정 (https://https://... 방지)
            const protocol = 'https://';
            if (finalUrl.split(protocol).length > 2) {
                finalUrl = protocol + finalUrl.split(protocol).pop();
            }

            // 3. 일반적인 이미지 확장자 체크 (.jpg, .png 등)
            const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)($|\?)/i.test(finalUrl);

            if (isImage) {
                return finalUrl;
            }

            // 위 조건에 모두 해당하지 않으면 기본 이미지 반환
            return defaultImg;
        }

        // signal 분석 시간 변화 함수(예. 방금전, 30분전, 1시간전...)
        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return '방금 전';

            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;

            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;

            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;

            // 일주일이 넘어가면 그냥 원래 날짜(년-월-일)를 보여줍니다.
            return dateString.split('T')[0];
        }

                } else {
                    // 다른 페이지(main, custom)에 있다면 해시 주소를 들고 강제 이동
                    window.location.href = `signal_log.html#signal-${signalNo}`;

                }
            } catch (err) {
                console.error("알림 확인 통신 오류:", err);
            }
        }
        // 주소창 뒤의 #signal-번호를 역추적해서 해당 카드로 부드럽게 스크롤하고 반짝임 효과를 주는 함수 (오류 파괴 버전)
        function executeScrollToCard() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#signal-')) return;

            // 🎯 [핵심 패치] querySelector 대신 브라우저 엔진이 가장 좋아하는 getElementById로 다이렉트 서칭!
            const targetCard = document.getElementById(hash.substring(1));

            if (targetCard) {
                setTimeout(() => {
                    // 1. 해당 카드가 브라우저 정중앙에 오도록 부드럽게 스크롤 무빙
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // 2. 테두리에 파란색 강렬한 네온 링과 글로우 이펙트 주입
                    targetCard.classList.add('ring-4', 'ring-blue-500', 'shadow-[0_0_25px_rgba(59,130,246,0.8)]', 'transition-all', 'duration-500');

                    // 3. 2초간 시선 집중을 시킨 뒤, 자연스럽게 원래 상태로 소멸 청소
                    setTimeout(() => {
                        targetCard.classList.remove('ring-4', 'ring-blue-500', 'shadow-[0_0_25px_rgba(59,130,246,0.8)]');
                    }, 2000);
                }, 300); // 렌더링 안정 마진 시간 0.3초
            }
        }

        // 아이템 삭제
        async function deleteItem(e, id) {
            e.stopPropagation();
            noti = noti.map(n => {
                if (n.id === id) {
                    // ID가 일치하면 읽음 처리된 복사본 반환
                    return { ...n, is_read: 1 };
                } else {
                    // ID가 일치하지 않으면 기존 데이터 그대로 반환
                    return n;
                }
            });
            await axios.post("/noti/read", {"id": id, "user_id": savedUserId});
            updateNotifUI();
        }

        // 모두 읽음
        async function allRead() {
            noti = noti.map(n => ({...n, is_read: 1}));
            await axios.get("/noti/read_all?id="+savedUserId);
            updateNotifUI();
        }

        // 3. 뉴스 카드 컴포넌트 (Template Function)
        function createNewsCard(news) {
            const riskColors = {
                "안정": "bg-blue-100 text-blue-700",
                "주의": "bg-yellow-100 text-yellow-700",
                "심각": "bg-red-100 text-red-700"
            };
            // console.log(news);
            const displayScore = 100-Math.round(Math.abs((news.risk_score || 0) * 100));
            // 🚨 [치명적 버그 해결] 날짜가 null이거나 없을 때 split 에러로 전체 화면이 얼어붙는 현상 완전 차단
            const displayDate = news.published_date ? news.published_date.split('T')[0] : "날짜 미상";
            const displayKeyword = Array.isArray(news.keyword) ? news.keyword.join(', ') : (news.keyword || '일반');
            let newBadge = '';
            if (!news.is_read) {
                newBadge = '<div class="absolute top-2 right-2 w-3 h-3 bg-blue-500 rounded-full border-2 border-white"></div>';
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition-shadow group cursor-pointer h-full relative" onclick="logNewsClick('${news.url}')">
                    <a href=${news.url} target="_blank">
                    <img src="${news.main_image}"
                        onerror="this.onerror=null; this.src='/static/img/signal_image.png';"
                        alt="news"
                        class="w-full h-48 object-cover">
                    </a>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-1 text-xs font-semibold rounded ${riskColors[news.risk_level] || 'bg-gray-100'}">
                                Signal ${displayScore}
                            </span>
                            <span class="text-xs text-blue-600 font-medium">${displayKeyword}</span>
                        </div>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-sm text-gray-500 h-8">${news.press_name}</span>
                            <span class="text-xs text-gray-400 h-8">${displayDate}</span>
                            </div>
                        <a href=${news.url} target="_blank" class="font-bold leading-tight group-hover:text-blue-600 transition-colors">${news.title}</a>
                    </div>
                    ${newBadge}
                </div>
            `;
        }

        // 4. 필터 및 정렬 렌더링 함수
        function render() {
            const filterContainer = document.getElementById('keyword-filters');
            const newsGrid = document.getElementById('news-grid');
            const statsText = document.getElementById('stats-text');


            let filtered = allSignals.filter(news => {
                if (selectedKeyword === null) return true; // '전체'일 때는 모두 통과

                if (news.keyword && Array.isArray(news.keyword)) {
                    // 기사가 가진 여러 키워드 중 하나라도 내가 클릭한 필터 버튼과 맞으면 패스!
                    return news.keyword.some(k => String(k).trim().toLowerCase() === selectedKeyword.trim().toLowerCase());
                }
                return String(news.keyword || '').trim().toLowerCase() === selectedKeyword.trim().toLowerCase();
            });
            // 필터링 및 정렬 로직
            filteredSignal = [...filtered].sort((a, b) => {
                // 1. 읽음 상태 기준 정렬 (읽지 않은 기사 !is_read 가 위로 오도록)
                const readA = !!a.is_read;
                const readB = !!b.is_read;
                if (readA !== readB) {
                    if (readA) {
                        return 1;  // a가 읽은 상태면 뒤로 보냄
                    } else {
                        return -1; // a가 읽지 않은 상태면 앞으로 보냄
                    }
                }
                // 2. 리스크 점수 기준 정렬 (낮은 점수가 위로)
                if (a.risk_score !== b.risk_score) {
                    return a.risk_score - b.risk_score;
                }
                // 3. 날짜 기준 정렬 (최신순)
                const dateA = new Date(a.published_date);
                const dateB = new Date(b.published_date);
                return dateB - dateA;

            });
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const endIndex = startIndex + SIGNALS_PER_PAGE;
            const currentSignals = filteredSignal.slice(startIndex, endIndex);

            // 필터 버튼 생성
            filterContainer.innerHTML = '<i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>';

            // '전체' 버튼
            const allBtn = document.createElement('button');
            allBtn.innerText = '전체';
            // 1. 기본 공통 스타일 설정
            let classNames = "px-4 py-2 rounded-lg transition-colors";

            // 2. 조건에 따른 스타일 분기 (if문)
            if (selectedKeyword === null) {
                // '전체'가 선택된 상태 (강조)
                classNames += " bg-gray-900 text-white";
            } else {
                // 다른 키워드가 선택된 상태 (비활성화 느낌)
                classNames += " bg-gray-100 text-gray-700 hover:bg-gray-200";
            }

            allBtn.className = classNames;
            allBtn.onclick = () => {
                selectedKeyword = null;
                currentPage = 1;
                render();
            };
            filterContainer.appendChild(allBtn);

            // 개별 키워드 버튼
            keyword.forEach(kw => {
                const btn = document.createElement('button');
                btn.innerText = kw;

                const isActive = selectedKeyword && (selectedKeyword.trim().toLowerCase() === kw.trim().toLowerCase());

                btn.className = 'px-4 py-2 rounded-lg transition-colors';

                if (isActive){
                    btn.className += " bg-blue-500 text-white";
                }else{
                    btn.className += " bg-blue-50 text-blue-600 hover:bg-blue-100"
                }
                btn.onclick = () => {
                    currentPage = 1;
                    selectedKeyword = kw.trim().toLowerCase();
                    // console.log(`${selectedKeyword} / ${kw}`)
                    render();
                };
                filterContainer.appendChild(btn);
            });

            // 뉴스 그리드 채우기
            newsGrid.innerHTML = currentSignals.map(news => createNewsCard(news)).join('');

            // 통계 갱신
            const unreadCount = filteredSignal.filter(n => !n.is_read).length;
            statsText.innerText = `${filteredSignal.length}개의 뉴스 · 읽지 않은 뉴스 ${unreadCount}개`;

            renderPagination();
            if (window.lucide) lucide.createIcons();
        }

        // 📡 기사 클릭 로그를 서버로 전송하는 함수
        async function logNewsClick(articleUrl) {

            // 로그인하지 않은 비회원은 로그를 쌓지 않거나 예외 처리
            if (savedUserId){
                // 2. 서버로 POST 요청 전송
                await axios.post("/news_view", {
                    id: savedUserId,
                    url: articleUrl
                });
                // console.log("열람 로그 전송 완료");
                setTimeout(() => {
                    window.location.reload();
                }, 100); // 0.1초 뒤 새로고침
            }
        }

        // 5. 페이지네이션 렌더링
        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredSignal.length / SIGNALS_PER_PAGE);

            if (totalPages <= 1) {

                paginationContainer.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="handlePageChange(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage === i ? 'bg-blue-600 text-white' : 'hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button onclick="handlePageChange(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            `;

            paginationContainer.innerHTML = html;
            lucide.createIcons(); // 아이콘 재생성
        }

        // 6. 이벤트 핸들러
        function handlePageChange(page) {
            currentPage = page;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function handleLogout() {
            showModal("로그아웃 하시겠습니까?", "confirm", async () => {
                 try {
                    await axios.get("/logout");
                    sessionStorage.removeItem('savedUserId');
                    location.href = "login.html";
                }catch (error) {
                    console.error("로그아웃 중 오류 발생:", error);
                    showModal("로그아웃 처리 중 문제가 발생했습니다. 다시 시도해주세요.", error);
                }
            });
        }

        // 모달 제어
        function showModal(msg, type, onConfirm = null) {
            const modal = document.getElementById('alert-modal');
            const iconDiv = document.getElementById('modal-icon');
            document.getElementById('modal-message').innerText = msg;
            
            if(type === 'success') {
                iconDiv.innerHTML = '<i data-lucide="check-circle" class="w-12 h-12 text-green-500"></i>';
            } else {
                iconDiv.innerHTML = '<i data-lucide="alert-circle" class="w-12 h-12 text-blue-500"></i>';
            }
            
            // 세 번째 인자로 들어온 함수(탈퇴 처리 로직 등)를 전역 변수에 담아둡니다.
            // 일반 알림창일 때는 아무것도 안 들어오므로 null이 됩니다.
            modalCallback = onConfirm;
            
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            // 1. 우선 화면에서 모달창을 숨깁니다.
            document.getElementById('alert-modal').classList.add('hidden');
            
            // 2. 만약 이번에 닫힌 모달창이 '특별한 행동(콜백)'을 품고 있었다면 실행합니다.
            if (typeof modalCallback === 'function') {
                modalCallback();    // 폼 제출 이벤트에서 넘겨준 async () => { axios.post... } 가 여기서 실행됩니다!
                modalCallback = null; // 실행 후에는 상자를 비워주어 다른 모달에 영향이 없게 합니다.
            }
        }

    </script>

    <style>
        .stretched-link::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            content: "";
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
