<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signal - 비밀번호 찾기</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            .hidden { display: none; }
            .modal-overlay {
                background-color: rgba(0, 0, 0, 0.5);
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center; z-index: 50;
            }
        </style>
    </head>
    <body class="bg-gray-50">

        <div id="alertModal" class="modal-overlay hidden">
            <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl text-center">
                <p id="modalMessage" class="text-gray-800 mb-4"></p>
                <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">확인</button>
            </div>
        </div>

        <div class="min-h-screen flex items-center justify-center px-4">
            <div class="max-w-md w-full">
                <div class="text-center mb-8">
                    <a href="main.html" class="mb-4 inline-block">
                        <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">Signal</span>
                    </a>
                    <h1 class="text-2xl font-bold mb-2">비밀번호 찾기</h1>
                    <p id="stepDescription" class="text-gray-600">가입 시 입력한 정보로 비밀번호를 재설정할 수 있습니다</p>
                </div>

                <div class="bg-white border rounded-xl p-8 shadow-sm">
                    
                    <form id="verifyForm" class="space-y-5">
                        <div>
                            <label class="block text-sm mb-2">아이디</label>
                            <input type="text" id="userIdInput" placeholder="아이디를 입력하세요" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm mb-2">이메일</label>
                            <input type="email" id="emailInput" placeholder="example@email.com" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium">인증코드 받기</button>
                    </form>

                    <form id="codeForm" class="space-y-5 hidden">
                        <div>
                            <label class="block text-sm mb-2">인증코드</label>
                            <input type="text" id="codeInput" placeholder="6자리 인증코드" maxlength="6" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                            <p id="emailTargetInfo" class="text-xs text-gray-500 mt-2"></p>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium">인증하기</button>
                    </form>

                    <form id="resetForm" class="space-y-5 hidden">
                        <div>
                            <label class="block text-sm mb-2">새 비밀번호</label>
                            <input type="password" id="newPasswordInput" placeholder="8자 이상 입력" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm mb-2">비밀번호 확인</label>
                            <input type="password" id="confirmPasswordInput" placeholder="비밀번호 재입력" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium">비밀번호 변경</button>
                    </form>

                    <div id="completeView" class="text-center hidden">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-green-600"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <h3 class="text-lg font-bold mb-2">비밀번호 변경 완료</h3>
                        <p class="text-gray-600 mb-6">새로운 비밀번호로 로그인해주세요.</p>
                        <a href="login.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-center font-medium">로그인하기</a>
                    </div>

                    <div id="footerLinks" class="mt-6 text-center text-sm space-y-2">
                        <a href="find_id.html" class="block text-blue-600 hover:text-blue-700">아이디 찾기</a>
                        <a href="login.html" class="block text-blue-600 hover:text-blue-700">로그인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>

    </body>
    <script>
        // 상태 관리 변수들
        let generatedCode = "";
        let currentUserId = "";

        // DOM 요소들
        const stepDescription = document.getElementById('stepDescription');
        const footerLinks = document.getElementById('footerLinks');
        
        const forms = {
            verify: document.getElementById('verifyForm'),
            code: document.getElementById('codeForm'),
            reset: document.getElementById('resetForm'),
            complete: document.getElementById('completeView')
        };

        // 1단계: 인증코드 요청
        forms.verify.addEventListener('submit', async function(e) {
            e.preventDefault();
            const userId = document.getElementById('userIdInput').value;
            const email = document.getElementById('emailInput').value;

            let {data} = await axios.post("/request_code", { userId, email });
            console.log(data);
            // 여기서는 리액트 코드와 동일한 데모 로직을 사용합니다.
            if (data.res) {
                // generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                generatedCode = "111111";
                currentUserId = userId; // 나중에 비밀번호 변경 시 필요할 수 있음
                
                showAlert(`인증코드가 발송되었습니다. (데모: 111111)`);
                
                // 화면 전환
                showStep("code");
                document.getElementById('emailTargetInfo').textContent = `${email}로 발송된 인증코드를 입력해주세요.`;
            } else {
                showAlert("입력하신 정보와 일치하는 계정을 찾을 수 없습니다.");
                document.getElementById('verifyForm').reset();
            }
        });

        // 2단계: 코드 확인
        forms.code.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputCode = document.getElementById('codeInput').value;

            if (inputCode === generatedCode) {
                showStep("reset");
            } else {
                showAlert("인증코드가 일치하지 않습니다.");
                document.getElementById('codeForm').reset();
            }
        });

        // 3단계: 비밀번호 재설정
        forms.reset.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPw = document.getElementById('newPasswordInput').value;
            const confirmPw = document.getElementById('confirmPasswordInput').value;

            if (newPw.length < 8) {
                showAlert("비밀번호는 8자 이상이어야 합니다.");
                return;
            }
            // if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(newPw)) {
            //     showAlert("비밀번호는 8자 이상이며, 영문과 숫자를 모두 포함해야 합니다.");
            //     return;
            // }
            if (newPw !== confirmPw) {
                showAlert("비밀번호가 일치하지 않습니다.");
                return;
            }

            let {data} = await axios.post("/reset_pw", { userId: currentUserId, password: newPw });
            console.log(data);
            if (data.res && data.res > 0) {
                showStep("complete");
            } else {
                showAlert("비밀번호 변경에 문제가 생겼습니다.");
            }
        });

        // 공통 함수: 단계 전환
        function showStep(stepName) {
            // 모든 폼 숨기기
            Object.values(forms).forEach(form => form.classList.add('hidden'));
            // 해당 단계 폼 보여주기
            forms[stepName].classList.remove('hidden');

            // 설명 문구 변경
            const descriptions = {
                verify: "가입 시 입력한 정보로 비밀번호를 재설정할 수 있습니다",
                code: "이메일로 발송된 인증코드를 입력해주세요",
                reset: "새로운 비밀번호를 입력해주세요",
                complete: "비밀번호가 성공적으로 변경되었습니다"
            };
            stepDescription.textContent = descriptions[stepName];

            // 완료 단계에서는 하단 링크 숨기기
            if (stepName === "complete") footerLinks.classList.add('hidden');
        }

        // 모달 제어
        function showAlert(msg) {
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('alertModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('alertModal').classList.add('hidden');
        }
    </script>
</html>
