<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signal - 아이디 찾기</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            /* Lucide 아이콘을 흉내내기 위한 간단한 스타일 */
            .hidden { display: none; }
            .modal-overlay {
                background-color: rgba(0, 0, 0, 0.5);
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 50;
            }
        </style>
    </head>
    <body class="bg-gray-50">

        <div id="alertModal" class="modal-overlay hidden">
            <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
                <div id="modalContent" class="text-center">
                    <p id="modalMessage" class="text-gray-800 mb-4"></p>
                    <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        확인
                    </button>
                </div>
            </div>
        </div>

        <div class="min-h-screen flex items-center justify-center px-4">
            <div class="max-w-md w-full">
                <div class="text-center mb-8">
                    <a href="main.html" class="mb-4 inline-block">
                        <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">
                            Signal
                        </span>
                    </a>
                    <h1 class="text-2xl font-bold mb-2">아이디 찾기</h1>
                    <p class="text-gray-600">가입 시 입력한 정보로 아이디를 찾을 수 있습니다</p>
                </div>

                <div class="bg-white border rounded-xl p-8 shadow-sm">
                    <form id="findIdForm" class="space-y-5">
                        <div>
                            <label class="block text-sm mb-2 font-medium">이름</label>
                            <input
                                type="text"
                                id="nameInput"
                                placeholder="홍길동"
                                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            />
                        </div>

                        <div>
                            <label class="block text-sm mb-2 font-medium">이메일</label>
                            <input
                                type="email"
                                id="emailInput"
                                placeholder="example@email.com"
                                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            />
                        </div>

                        <button
                            type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors font-medium"
                        >
                            아이디 찾기
                        </button>
                    </form>
                    <form id="codeForm" class="space-y-5 hidden">
                        <div>
                            <label class="block text-sm mb-2 font-medium">인증코드 입력</label>
                            <input type="text" id="codeInput" placeholder="6자리 인증코드" maxlength="6" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 outline-none" required />
                            <p id="emailTargetInfo" class="text-xs text-gray-500 mt-2"></p>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors font-medium">인증 및 아이디 확인</button>
                    </form>
                    <div id="resultView" class="text-center hidden">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-600"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <h3 class="text-lg font-bold mb-2">아이디를 찾았습니다</h3>
                        <p class="text-gray-600 mb-6">회원님의 아이디는 다음과 같습니다.</p>

                        <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg mb-6">
                            <div class="flex items-center justify-center gap-2">
                                <div id="foundIdList" class="space-y-3 w-full text-left">
                                </div>
                            </div>
                        </div>

                        <!-- <a href="login.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors text-center font-medium">
                            로그인하기
                        </a> -->
                    </div>

                    <div class="mt-6 text-center text-sm space-y-2">
                        <a href="find_pw.html" class="block text-blue-600 hover:text-blue-700">
                            비밀번호 찾기
                        </a>
                        <a href="login.html" class="block text-blue-600 hover:text-blue-700">
                            로그인하기
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </body>
    <script>
        const findIdForm = document.getElementById('findIdForm');
        const codeForm = document.getElementById('codeForm');
        const resultView = document.getElementById('resultView');
        const stepDescription = document.getElementById('stepDescription');
        const foundIdDisplay = document.getElementById('foundIdDisplay');
        const alertModal = document.getElementById('alertModal');
        const modalMessage = document.getElementById('modalMessage');

        // 폼 제출 핸들러
        findIdForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;
            const email = document.getElementById('emailInput').value;

            try {
                let {data} = await axios.post("/find_id/request", { "name": name, "email": email });
                console.log(data);
                if (data.res) {
                    showAlert("입력하신 이메일로 인증코드가 발송되었습니다.");

                    findIdForm.classList.add('hidden'); // 이름/이메일 창 숨기기
                    codeForm.classList.remove('hidden'); // 👈 인증코드 입력창 보여주기
                    stepDescription.textContent = "이메일로 발송된 인증코드를 입력해주세요";
                    document.getElementById('emailTargetInfo').textContent = `${email}로 발송된 6자리 코드를 입력하세요.`;
                }
                if (data.res && data.res.length > 0) {
                    // 1. 결과 데이터 배열을 순회하며 HTML 생성
                    const listItems = data.res.map(user => `
                        <div class="flex flex-col p-3 bg-white border border-blue-100 rounded-md shadow-sm">
                            <div class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-600"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                                <span class="font-bold text-blue-900 text-[18px]">${user.id}</span>
                            </div>
                            <div class="text-[16px] text-gray-500 mt-1 pl-6">
                                가입일: ${user.create_at}
                            </div>
                        </div>
                    `).join(''); // 배열을 하나의 문자열로 합침

                    // 2. 결과 컨테이너에 주입
                    const foundIdList = document.getElementById('foundIdList');
                    foundIdList.innerHTML = listItems;

                    // 3. 화면 전환
                    findIdForm.classList.add('hidden');
                    resultView.classList.remove('hidden');
                    
                } else {
                    showAlert("입력하신 정보와 일치하는 계정을 찾을 수 없습니다.");
                    findIdForm.reset();
                }
            } catch (error) {
                console.error(error);
                showAlert("서버 통신 중 오류가 발생했습니다.");
            }
        });

        // 모달 제어 함수
        function showAlert(message) {
            modalMessage.textContent = message;
            alertModal.classList.remove('hidden');
        }

        function closeModal() {
            alertModal.classList.add('hidden');
        }

        // 배경 클릭 시 모달 닫기
        window.onclick = function(event) {
            if (event.target == alertModal) {
                closeModal();
            }
        }

        // 인증코드 검증 요청 및 아이디 노출
        codeForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('codeInput').value;

            try {
                let {data} = await axios.post("/find_id/verify", { code });
                if (data.res) {
                    // 백엔드가 준 가입 계정 배열(data.data)을 카드로 가공
                    const listItems = data.data.map(user => `
                        <div class="flex flex-col p-3 bg-white border border-blue-100 rounded-md shadow-sm">
                            <div class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-600"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                                <span class="font-bold text-blue-900 text-[18px]">${user.id}</span>
                            </div>
                            <div class="text-[14px] text-gray-500 mt-1 pl-6">가입일: ${user.create_at}</div>
                        </div>
                    `).join('');

                    document.getElementById('foundIdList').innerHTML = listItems;

                    // 화면 최종 전환
                    codeForm.classList.add('hidden'); // 코드창 숨기기
                    resultView.classList.remove('hidden'); // 결과창 밝히기
                    stepDescription.textContent = "아이디 확인이 완료되었습니다.";
                    footerLinks.classList.add('hidden'); // 로그인/비번찾기 하단 링크 숨김
                } else {
                    showAlert(data.msg || "인증코드가 올바르지 않습니다.");
                }
            } catch (error) {
                showAlert("인증 실패 시스템 오류 발생");
            }
        });
    </script>
</html>
