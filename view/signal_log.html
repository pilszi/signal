<html lang="ko">
    <head>
        <script>
            (function checkAuth() {
                // 1. 세션 스토리지에서 아이디 확인
                const savedUserId = sessionStorage.getItem("savedUserId");
                
                // 2. 로그인 여부 판단 (값이 없거나 'guest'인 경우)
                if (!savedUserId || savedUserId === "guest" || savedUserId === "null") {
                    // 로그인 안 됨: 경고창을 띄우고 로그인 페이지로 이동

                    // 페이지 본문이 보이지 않도록 즉시 중단 (일종의 가드)
                    document.documentElement.style.display = 'none';
                }
            })();
     </script>   
        <meta charset="UTF-8">

        <style>
            .notif-container {
                position: relative;
                display: inline-block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */
                position: relative;
                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */
            .notif-footer {
                padding: 12px;
                text-align: center;
                background-color: #f9fafb;
            }

            .all-read-btn {
                background: none;
                border: none;
                color: #2563eb;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }

            .all-read-btn:hover { text-decoration: underline; }

            .report-card {
                padding: 24px;
                border-radius: 16px;
                margin-bottom: 16px;
                line-height: 1.5;
                transition: all 0.3s ease;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            }

            .risk-severe {
                background-color: #fff1f0;
                border: 2px solid #ff4d4f;
                color: #820014;
            }

            .risk-warning {
                background-color: #fffbe6;
                border: 2px solid #ffc53d;
                color: #874d00;
            }

            .risk-stable {
                background-color: #e6f7ff;
                border: 2px solid #40a9ff;
                color: #003a8c;
            }

        </style>
    </head>

    <script>
        // 1. 상태 관리 변수
        let allSignals = [];      // 상세 로그 리스트용
        let filteredSignals = [];  // 필터 적용된 데이터
        let currentPage = 1;
        const SIGNALS_PER_PAGE = 10;
        let selectedLevel = null;
        let savedUserId = sessionStorage.getItem("savedUserId");
        let noti = [];            // 실시간 사이드바 및 알림용
        const trigger = document.getElementById('notifTrigger');
        const dropdown = document.getElementById('notifDropdown');

        // 시그널 컬러 테마
        const levelStyles = {
            "심각": { bg: "bg-[#FFF0F0]", border: "border-red-400", badge: "bg-red-500", text: "text-red-800" },
            "주의": { bg: "bg-[#FFFBEB]", border: "border-yellow-400", badge: "bg-yellow-500", text: "text-yellow-800" },
            "안정": { bg: "bg-[#F0F7FF]", border: "border-blue-400", badge: "bg-blue-500", text: "text-blue-800" }
        };

        // 2. 데이터 가져오기 통합 (상세 로그 + 알림 데이터)
        async function refreshAllData() {
            try {
                // [병렬 호출로 속도 최적화]
                const [signalsRes, notiRes] = await Promise.all([
                    axios.get('/signal_log?id=' + savedUserId),
                    axios.get("/noti/signal?id=" + savedUserId)
                ]);

                // 2. 전체 로그 처리
                allSignals = (signalsRes.data && signalsRes.data.data) ? signalsRes.data.data : [];

                // 3. 알림용 데이터 처리 (기존 로직 + 안전장치)
                noti = (notiRes.data && notiRes.data.noti) ? notiRes.data.noti : (Array.isArray(notiRes.data) ? notiRes.data : []);

                // 4. 렌더링 동기화
                applyFilterAndRender(); // allSignals 기반으로 페이지 리스트 갱신
                updateNotifUI_Static(); // noti 기반으로 알림 뱃지 및 드롭다운 갱신

            } catch (error) {
                // 데이터 동기화 실패 시에도 시스템이 멈추지 않게 방어
                console.error("데이터 동기화 실패:", error);
            }
        }
        let hasPendingScroll = false;

        // 3. 필터링 및 메인 리스트 렌더링
        function applyFilterAndRender() {
            // 1. 필터링
            if (!selectedLevel || selectedLevel === '전체') {
                filteredSignals = [...allSignals];
            } else {
                filteredSignals = allSignals.filter(
                    s => s.risk_level.includes(selectedLevel)
                );
            }

            // 2. 최신순 정렬
            filteredSignals.sort(
                (a, b) => new Date(b.signal_time) - new Date(a.signal_time)
            );

            // 3. 렌더링
            renderSignalList();
            renderPagination();

            // 4. 최초 1회만 스크롤 이동 실행
            if (hasPendingScroll) {
                executeScrollToCard();
            }
        }
        // 5. 상세 리스트 렌더링
        function renderSignalList() {
            const listContainer = document.getElementById('signal-list');
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const currentSignals = filteredSignals.slice(startIndex, startIndex + SIGNALS_PER_PAGE);

            if (currentSignals.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white p-20 rounded-xl text-center text-gray-400 border border-dashed">
                        일치하는 시그널 로그가 없습니다.
                    </div>`;
                return;
            }

            listContainer.innerHTML = currentSignals.map(signal => {
                // 컬러 테마 적용
                const style = levelStyles[signal.risk_level] || levelStyles["안정"];

                return `
                    <div id="signal-${signal.id}" class="${style.bg} border-2 ${style.border} rounded-2xl p-8 mb-6 shadow-sm transition-all hover:shadow-md">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-bold text-gray-500">${signal.signal_time.replace('T', ' ')}</span>
                                <span class="${style.badge} text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">
                                    ${signal.risk_level}
                                </span>
                            </div>
                        </div>

                        <h3 class="text-xl font-bold ${style.text} mb-6">
                            ${signal.prediction}
                        </h3>

                        <div class="space-y-5 text-sm">
                            <div>
                                <p class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-tight">예측 근거</p>
                                <p class="text-gray-800 font-medium leading-relaxed">${signal.prediction_reason}</p>
                            </div>
                            <div class="pt-3 border-t border-current/10">
                                <p class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-tight">예측</p>
                                <p class="text-gray-800 font-medium leading-relaxed">${signal.prediction}</p>
                            </div>
                        </div>

                        <div class="mt-8 flex justify-between items-center">
                            <a href="${signal.url}" target="_blank" class="text-blue-600 text-xs font-bold flex items-center gap-1 hover:underline">
                                기사 원문 보기 <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                            <div class="flex gap-1">
                                ${(signal.match_keyword || []).map(kw => `
                                    <span class="text-[10px] bg-white/60 px-2 py-0.5 rounded border border-gray-200 text-gray-500 font-medium">#${kw}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
    }

        // 6. 실시간 사이드바 렌더링
        function renderSignalLogs() {
            const logs = noti.filter(n => n.risk_level === "심각" || n.risk_level === "주의");
            const container = document.getElementById('signal-log-container');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">안정적인 상태입니다.</p>';
                return;
            }

            container.innerHTML = logs.slice(0, 5).map(log => `
                <div class="p-3 border-b last:border-0 hover:bg-gray-50 transition-colors cursor-pointer rounded-lg" onclick="location.href='signal_log.html'">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-bold ${log.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} uppercase">[${log.risk_level}]</span>
                        <span class="text-[9px] text-gray-400">${timeAgo(log.time || log.signal_time)}</span>
                    </div>
                    <p class="text-xs font-semibold text-gray-800 mb-1 line-clamp-1"> ${log.message || log.prediction || '리스크 감지'}</p>
                </div>
            `).join('');
        }

        // 7. 알림 UI 업데이트 (데이터 호출 없이 UI만 갱신)
        function updateNotifUI_Static() {
            // 🛠️ [초정밀 방어선] 데이터가 가동되기 전 루프가 빗겨 맞더라도 에러 튕김을 원천 차단합니다.
            if (!noti || !Array.isArray(noti)) {
                noti = [];
            }

            const badge = document.getElementById('notifBadge');

            // 이제 noti가 무조건 배열임이 보장되므로 .filter()가 절대 죽지 않습니다.
            const unreads = noti.filter(n => !n.is_read);

            if (unreads.length > 0) {
                if (badge) {
                    badge.innerText = unreads.length;
                    badge.style.display = 'flex';
                }
            } else {
                if (badge) badge.style.display = 'none';
            }

            const countText = document.getElementById('notifCountText');
            if (countText) {
                countText.innerText = `${unreads.length}개의 새 알림`;
            }

            renderList(document.getElementById('notifList'), noti);
            renderSignalLogs();
            if (window.lucide) lucide.createIcons();
        }

        // HTML과 연결되는 유일한 필터 함수
        function filterLevel(level) {
            // 1. 전역 상태 업데이트 (전체일 경우 null 처리)
            selectedLevel = (level === '전체') ? null : level;
            currentPage = 1;

            // 2. 필터 버튼 시각적 피드백 (Tailwind 클래스 직접 조작)
            document.querySelectorAll('#filter-container button').forEach(btn => {
                const btnText = btn.innerText;

                // 클릭한 버튼과 텍스트가 일치하거나, '전체' 버튼을 누른 경우 강조
                if ((level === '전체' && btnText === '전체') || (level !== '전체' && btnText.includes(level))) {
                    btn.className = "px-4 py-2 rounded-lg bg-gray-900 text-white font-bold shadow-md transition-all";
                } else {
                    // 나머지 버튼들은 원래의 등급별 색상으로 복원
                    if (btnText.includes('심각')) btn.className = "px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors";
                    else if (btnText.includes('주의')) btn.className = "px-5 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition-colors";
                    else if (btnText.includes('안정')) btn.className = "px-5 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors";
                    else btn.className = "px-4 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors";
                }
            });

            // 3. 필터 적용 및 화면 다시 그리기 (핵심!)
            applyFilterAndRender();
        }

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                await axios.get("/logout");
                sessionStorage.clear();
                location.href = "login.html";
            }
        }

        // 10. 유틸리티 및 페이지네이션
        function timeAgo(dateString) {
            // 🛠️ [방어 코드] 데이터가 유실되거나 비어있을 때 .split 엔진이 크래시 나는 것을 원천 차단
            if (!dateString || typeof dateString !== 'string') {
                return '방금 전';
            }

            const diff = Math.floor((new Date() - new Date(dateString)) / 1000);
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;

            return dateString.includes(' ') ? dateString.split(' ')[0] : dateString;
        }



        function handlePageChange(page) {
            currentPage = page;
            renderSignalList();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredSignals.length / SIGNALS_PER_PAGE);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button onclick="handlePageChange(${currentPage-1})" ${currentPage===1?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage===i?'bg-blue-600 text-white':'hover:bg-gray-50'}">${i}</button>`;
            }
            html += `<button onclick="handlePageChange(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>`;
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }



        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            // 태그가 없을 시 함수 종료(에러방지)
            // console.log(authContainer);
            if (!authContainer){return};
            const userGreeting = document.getElementById('user-greeting');

            if (userGreeting && savedUserId && savedUserId !== 'guest' && savedUserId !== 'null') {
                // 1. 인사말 영역 처리
                // 관리자 계정일 경우
                if (savedUserId === 'admin') {
                    userGreeting.innerHTML = `
                        <div class="text-sm text-gray-600">
                            <a href="admin.html" class="font-bold px-1 hover:bg-blue-300 transition-colors rounded-md">관리자님</a>
                                반갑습니다
                        </div>
                        `
                // 회원 계정일 경우
                } else {
                    userGreeting.innerHTML = `
                        <a class="text-sm text-gray-600">
                            <span>${savedUserId} 님 반갑습니다</span>
                        </a>
                        `
                }

                // 2. 로그아웃 버튼 표시
                authContainer.innerHTML = `
                    <button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">
                        LOG OUT
                    </button>
                `;
            } else {
                // 로그아웃 상태일 때
                if (userGreeting) {
                    userGreeting.classList.add('hidden'); // 인사말 숨김
                }

                authContainer.innerHTML = `
                    <a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">
                        LOG IN
                    </a>
                `;
            }

            // 아이콘 리렌더링 안정화
            if (window.lucide) lucide.createIcons();
        }


        // 1. 알림 UI 및 배지 수량 실시간 갱신
        async function updateNotifUI() {
            const badge = document.getElementById('notifBadge');
            const listContainer = document.getElementById('notifList');
            const countText = document.getElementById('notifCountText');

            // 비회원 및 게스트 유저 예외 방어 처리
            if (!savedUserId || savedUserId === "null" || savedUserId === "undefined" || savedUserId === "guest") {
                if (badge) badge.style.display = 'none';
                if (countText) countText.innerText = '0개의 새 알림';
                if (listContainer) {
                    listContainer.innerHTML = `
                        <div style="padding: 40px; text-align: center;">
                            <p style="color: #9ca3af; font-size: 14px;">로그인 후 알림을 확인하세요.</p>
                        </div>`;
                }
                return;
            }

            try {
                // 백엔드 통합 알림 API 호출
                const { data } = await axios.get(`/noti/signal?id=${savedUserId}`);
                const notiList = data.noti || [];

                // 드롭다운 내부에 알림 카드 카드 출력
                renderList(listContainer, notiList);

                // 안 읽은 알림(alarm_view = 0)만 카운팅하여 빨간색 배지 노출
                const unreads = notiList.filter(n => !n.is_read);
                if (countText) countText.innerText = `${unreads.length}개의 새 알림`;

                if (badge) {
                    if (unreads.length > 0) {
                        badge.innerText = unreads.length;
                        badge.style.display = 'flex'; // 혹은 block
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error("알림 UI 로드 실패:", error);
            }
        }

        // 2. 알림 드롭다운 카드 내부 디자인 렌더링
        function renderList(container, notiList) {
            if (!container) return;

            if (notiList.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #9ca3af; font-size: 13px;">새로운 알림이 없습니다.</div>';
                container.style.maxHeight = 'none';
                container.style.overflowY = 'visible';
                return;
            }

            // 알림이 5개 이상 쌓일 때만 내부 스크롤바 활성화하여 레이아웃 붕괴 방지
            if (notiList.length >= 5) {
                container.style.maxHeight = '420px';
                container.style.overflowY = 'auto';
            } else {
                container.style.maxHeight = 'none';
                container.style.overflowY = 'visible';
            }

            container.innerHTML = notiList.map(n => {
                let icon = "bell";
                let iconColor = "text-gray-400";
                let bgColor = "bg-gray-100";

                // 위험 수위가 '심각'인 비상용 시그널 처리
                if (n.type === 'emergency') {
                    icon = "alert-triangle";
                    iconColor = "text-red-500";
                    bgColor = "bg-red-50";
                }

                return `
                    <div class="notif-item p-4 border-b flex gap-3 relative hover:bg-gray-50 transition-colors ${n.is_read ? '' : 'unread'}"
                         onclick="readItem(${n.id}, ${n.signal_no})">
                        <div class="w-10 h-10 ${bgColor} ${iconColor} rounded-lg flex items-center justify-center flex-shrink-0 border border-current/10">
                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                        </div>

                        <div class="flex-1 pr-6">
                            <div class="text-sm font-bold text-gray-900 mb-0.5 line-clamp-1">${n.title}</div>
                            <div class="text-xs text-gray-600 line-clamp-2 leading-relaxed">${n.message}</div>
                            <div class="flex items-center gap-2 mt-1.5">
                                <span class="text-[10px] text-gray-400">${timeAgo(n.time)}</span>
                                ${n.is_read ? '' : '<span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>'}
                            </div>
                        </div>

                        <button onclick="deleteItem(event, ${n.id})" class="absolute right-2 top-4 p-1 text-gray-300 hover:text-red-500 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('') + `
                <div class="p-3 text-center bg-gray-50 rounded-b-xl border-t">
                    <button onclick="allRead()" class="text-xs text-blue-600 font-bold hover:underline transition-all">
                        모두 읽음으로 표시
                    </button>
                </div>`;

            if (window.lucide) lucide.createIcons();
        }

        // signal_log.html 전용 readItem (최종 마감 버전)
        async function readItem(id, signalNo) {
            try {
                // 1. 서버 읽음 처리
                await axios.post("/noti/read", { "id": String(id), "user_id": savedUserId });

                noti = noti.map(n => String(n.signal_no) === String(signalNo) ? { ...n, is_read: 1 } : n);
                updateNotifUI_Static();

                // 3. 알림창 닫기
                const dropdown = document.getElementById('notifDropdown');
                if (dropdown) dropdown.classList.add('hidden');

                // 3. 해시 변경 (주소창에 #signal-149가 뜸)
                window.location.hash = `#signal-${signalNo}`;
                hasPendingScroll = true;
                if (typeof executeScrollToCard === 'function') {
                    executeScrollToCard();
                } else {
                    window.location.href = `signal_log.html#signal-${signalNo}`;
                }
            } catch (err) {
                console.error("알림 확인 통신 오류:", err);
            }
        }

        // [세 페이지 공통] 타입 미스매치 버그가 완벽 해결된 실시간 삭제 카운터 함수
        async function deleteItem(e, id) {
            // 1. 부모 박스 클릭 이벤트 전파 차단
            e.stopPropagation();

            // 2. 화면에서 카드 레이아웃 즉시 파기
            const targetItem = e.target.closest('.notif-item');
            if (targetItem) {
                targetItem.remove();
            }

            noti = noti.filter(
                n => String(n.id) !== String(id)
            );

            // 4. 안 읽은 알림 수 재계산
            const unreads = noti.filter(n => !n.is_read);

            // 5. 알림창 드롭다운 헤더 텍스트 실시간 동기화 ("X개의 새 알림")
            const countText = document.getElementById('notifCountText');
            if (countText) {
                countText.innerText = `${unreads.length}개의 새 알림`;
            }

            // 6. 종 모양 배지 숫자 실시간 동기화
            const badge = document.getElementById('notifBadge');
            if (badge) {
                if (unreads.length > 0) {
                    badge.innerText = unreads.length;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none'; // 0개가 되면 빨간 배지 숨김
                }
            }

            // 7. 알림판에 더 이상 남은 기사가 없을 때 안내 텍스트 출력
            const listContainer = document.getElementById('notifList');
            if (listContainer) {
                const remainingItems = listContainer.querySelectorAll('.notif-item');
                if (remainingItems.length === 0) {
                    listContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: #9ca3af; font-size: 13px;">새로운 알림이 없습니다.</div>';
                    listContainer.style.maxHeight = 'none';
                    listContainer.style.overflowY = 'visible';
                }
            }

            // 8. 시그널 로그 페이지용 실시간 사이드바 연동 방어선
            if (typeof renderSignalLogs === 'function') {
                renderSignalLogs();
            }

            // 9. 백엔드 데이터베이스 소프트 하이드 상태 변경 (백그라운드 처리)
            try {
                await axios.post("/noti/delete", { "id": id, "user_id": savedUserId });
            } catch (err) {
                console.error("알림 숨김 처리 서버 통신 에러:", err);
            }
        }

        // 5. 하단 모두 읽음 버튼 클릭 시: 비동기 POST 일괄 확인 완료 처리
        async function allRead() {
            try {
                let { data } = await axios.post("/noti/read_all", { "user_id": savedUserId });
                if (data.res) {
                    await refreshAllData();
                }
            } catch (err) {
                console.error("전체 알림 읽음 처리 통신 오류:", err);
            }
        }
        // 🎯 [완전체] 데이터 추적 + 페이지네이션 전환 + 렌더링 동기화 완벽 결합
        async function executeScrollToCard() {
            console.log("🚨 executeScrollToCard 진입");
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#signal-')) return;

            const targetId = hash.replace('#signal-', '');
            // 💡 [추가] 156번이 전체 데이터에는 있는지, 필터 데이터에는 없는지 확인
            const existsInAll = allSignals.find(s => String(s.id) === String(targetId));
            const existsInFiltered = filteredSignals.find(s => String(s.id) === String(targetId));

            console.log("🔍 [진단] 타겟:", targetId);
            console.log("🔍 전체 데이터에 존재?", !!existsInAll);
            console.log("🔍 필터링 데이터에 존재?", !!existsInFiltered);
            console.log("🔍 현재 선택된 레벨(selectedLevel):", selectedLevel);
            // ----------------------------------------------------------------
            // 1. 데이터가 로드될 때까지 0.1초씩 재시도 (비동기 데이터 보호)
            if (!allSignals || allSignals.length === 0) {
                setTimeout(executeScrollToCard, 100);
                return;
            }

            // 2. 현재 필터에 없으면 자동으로 전체 보기로 복구
            let targetIndex = filteredSignals.findIndex(
                s => String(s.id) === String(targetId)
            );

            // 💥 핵심 패치
            if (targetIndex === -1) {
                console.log("⚠️ 현재 필터에 없음 → 전체 보기로 자동 복구");

                selectedLevel = null;

                // 버튼 UI도 전체 상태로 복구
                document.querySelectorAll('#filter-container button').forEach(btn => {
                    const btnText = btn.innerText;

                    if (btnText === '전체') {
                        btn.className =
                            "px-4 py-2 rounded-lg bg-gray-900 text-white font-bold shadow-md transition-all";
                    } else if (btnText.includes('심각')) {
                        btn.className =
                            "px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors";
                    } else if (btnText.includes('주의')) {
                        btn.className =
                            "px-5 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition-colors";
                    } else if (btnText.includes('안정')) {
                        btn.className =
                            "px-5 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors";
                    }
                });

                applyFilterAndRender();

                // 다시 타겟 찾기
                targetIndex = filteredSignals.findIndex(
                    s => String(s.id) === String(targetId)
                );
            }

            if (targetIndex !== -1) {
                const targetPage = Math.ceil((targetIndex + 1) / SIGNALS_PER_PAGE);

                // 페이지 이동 필요 시
                if (currentPage !== targetPage) {
                    currentPage = targetPage;
                    applyFilterAndRender();

                    await new Promise(resolve =>
                        requestAnimationFrame(() =>
                            requestAnimationFrame(resolve)
                        )
                    );
                }

                // DOM 렌더링 완료 후 카드 찾기
                const targetCard = document.getElementById(`signal-${targetId}`);

                if (targetCard) {

                    setTimeout(() => {

                        targetCard.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });

                        targetCard.classList.add(
                            'ring-4',
                            'ring-blue-500',
                            'shadow-[0_0_25px_rgba(59,130,246,0.8)]',
                            'transition-all',
                            'duration-500'
                        );

                        setTimeout(() => {
                            targetCard.classList.remove(
                                'ring-4',
                                'ring-blue-500',
                                'shadow-[0_0_25px_rgba(59,130,246,0.8)]'
                            );

                            history.replaceState(
                                null,
                                null,
                                window.location.pathname
                            );

                        }, 2000);

                    }, 300);

                } else {
                    console.log("❌ 카드 DOM 못 찾음:", targetId);
                }
            }
        }
        // 💡 [참고] 기존 DOMContentLoaded 이벤트 리스너의 맨 아래에 넣어주세요!
        document.addEventListener('DOMContentLoaded', async () => {
            const currentPath = window.location.pathname.split("/").pop() || "signal.html";
            const navItems = document.querySelectorAll('.nav-item');

            updateNavbar();
            axios.get("/session_out");
            await refreshAllData();

            navItems.forEach(item => {
                // href 속성값에서 파일명만 가져와서 비교
                const itemHref = item.getAttribute('href').split("/").pop();

                if (currentPath === itemHref) {
                    if (item.querySelector('i')) {
                        item.classList.replace('text-gray-600', 'text-blue-600');
                        item.classList.add('bg-blue-50');
                    } else {
                        item.classList.remove('text-gray-600', 'hover:bg-gray-50');
                        item.classList.add('bg-gradient-to-br', 'from-blue-600', 'to-blue-800', 'text-white');
                    }
                }
            });
            // 6. 아이콘 최종 렌더링
            if (window.lucide) lucide.createIcons();

            // 🎯 페이지 로드 시 해시가 있으면 추적 스크롤 가동!
            executeScrollToCard();
        });

        // 드롭다운 토글 제어
        if (trigger && dropdown) {
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!document.getElementById('notifContainer').contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        }

    </script>
</html>
