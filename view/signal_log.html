    <script>
        // 1. 상태 관리 변수
        let allSignals = []; // 서버에서 가져올 전체 데이터
        let filteredSignals = [];
        let currentPage = 1;
        const SIGNALS_PER_PAGE = 10;
        let selectedLevel = null;
        let savedUserId = sessionStorage.getItem("savedUserId");
        let noti = [];

        // 2. 데이터 가져오기 (FastAPI 연결 시)
        async function fetchSignals() {
            try {
                // mockData 대신 서버 API 호출 (예시)
                const {data} = await axios.get('/signal_log?id='+savedUserId);
                console.log(data);
                allSignals = data.data;
                
                applyFilterAndRender();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
            }
        }

        // 3. 필터링 및 정렬 로직
        function applyFilterAndRender() {
            // 필터링
            filteredSignals = selectedLevel
                ? allSignals.filter(s => s.risk_level === selectedLevel)
                : allSignals;

            // 최신순 정렬
            filteredSignals.sort((a, b) => new Date(b.analyzed_at) - new Date(a.analyzed_at));

            renderSignalList(filteredSignals);
            renderPagination();
        }

        // 4. 리스트 렌더링
        function renderSignalList(signal) {
            const listContainer = document.getElementById('signal-list');
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const currentSignals = filteredSignals.slice(startIndex, startIndex + SIGNALS_PER_PAGE);

            listContainer.innerHTML = currentSignals.map(signal => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-2 py-1 rounded text-xs font-bold ${getLevelStyle(signal.risk_level)}">
                            Level ${signal.risk_level}
                        </span>
                        <span class="text-xs text-gray-400">${signal.signal_time.split('T')[0]}</span>
                    </div>
                    <p class="text-gray-600 text-xs">예측</p>
                    <p class="text-black-600 text-m">${signal.prediction || '세부 정보가 없습니다.'}</p>
                    <p class="text-gray-600 text-xs">예측근거</p>
                    <p class="text-black-600 text-m">${signal.prediction_reason || '세부 정보가 없습니다.'}</p>
                </div>
            `).join('');
        }

        // 5. 페이지네이션 렌더링
        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredSignals.length / SIGNALS_PER_PAGE);
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="handlePageChange(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage === i ? 'bg-blue-600 text-white' : 'hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button onclick="handlePageChange(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            `;

            paginationContainer.innerHTML = html;
            lucide.createIcons(); // 아이콘 재생성
        }

        // 6. 이벤트 핸들러
        function handlePageChange(page) {
            currentPage = page;
            renderSignalList();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleLevelFilter(level) {
            selectedLevel = level;
            currentPage = 1;
            
            // 버튼 스타일 업데이트 (선택 사항)
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.replace('bg-gray-900', 'bg-gray-100'); // 단순 예시
            });

            applyFilterAndRender();
        }

        function getLevelStyle(level) {
            if (level === "심각") return "bg-red-100 text-red-600";
            if (level === "주의") return "bg-yellow-100 text-yellow-600";
            return "bg-blue-100 text-blue-600";
        }

        // Navbar 상태 업데이트
        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            // 태그가 없을 시 함수 종료(에러방지)
            // console.log(authContainer);
            if (!authContainer){return};
            const userNameSpan = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');
            // console.log(`${loggedInId} / ${userNameSpan} / ${userGreeting}`);

            if (savedUserId && savedUserId !== 'guest' && savedUserId !== 'null') {
                // 1. 인사말 영역 처리
                if (userGreeting && userNameSpan) {
                    userNameSpan.textContent = savedUserId; // 아이디 텍스트 삽입
                    userGreeting.classList.remove('hidden'); // 'hidden' 클래스 제거하여 노출
                }

                // 2. 로그아웃 버튼 표시
                authContainer.innerHTML = `
                    <button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">
                        LOG OUT
                    </button>
                `;
            } else {
                // 로그아웃 상태일 때
                if (userGreeting) {
                    userGreeting.classList.add('hidden'); // 인사말 숨김
                }

                authContainer.innerHTML = `
                    <a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">
                        LOG IN
                    </a>
                `;
            }
            
            if (window.lucide) lucide.createIcons();
        }

        const trigger = document.getElementById('notifTrigger');
        const dropdown = document.getElementById('notifDropdown');
        const list = document.getElementById('notifList');

        // 토글 이벤트
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        // 외부 클릭 시 닫기
        document.addEventListener('click', (e) => {
            if (!document.getElementById('notifContainer').contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // signal 분석 시간 변화 함수(예. 방금전, 30분전, 1시간전...)
        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return '방금 전';
            
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
            
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;
            
            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;
            
            // 일주일이 넘어가면 그냥 원래 날짜(년-월-일)를 보여줍니다.
            return dateString.split('T')[0]; 
        }

        // 알림 렌더링 함수
        async function updateNotifUI() {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const countText = document.getElementById('notifCountText');
            // 1. 로그인 여부 확인 (React 코드의 로직 반영)
            
            const {data} = await axios.get("/noti/signal?id="+savedUserId);
            console.log(data);
            noti = data.noti;
            // 로그인 정보가 없거나 guest인 경우 알림 목록을 표시하지 않음
            if (!savedUserId || savedUserId === "guest") {
                badge.style.display = 'none'; // 배지 숨김
                countText.innerText = '0개의 새 알림';
                list.innerHTML = `
                    <div style="padding: 40px; text-align: center;">
                        <p style="color: #9ca3af; font-size: 14px;">로그인 후 알림을 확인하세요.</p>
                    </div>`;
                return;
            }
            
            const unreads = noti.filter(n => !n.is_read);
            
            // 새 알림이 있을 때만 배지 표시
            if (unreads.length > 0) {
                badge.innerText = unreads.length;
                badge.style.display = 'flex'; // 로그인 + 새 알림 있음 -> 표시
            } else {
                badge.style.display = 'none'; // 로그인 + 새 알림 없음 -> 숨김
            }

            // 드롭다운 내부 문구 업데이트
            countText.innerText = `${unreads.length}개의 새 알림`;

            // 알림 리스트 렌더링 로직 (기존과 동일)
            renderList(list, noti);
        }

        function renderList(container, noti) {
            if (noti.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #9ca3af;">새로운 알림이 없습니다.</div>';
                return;
            }
            
            container.innerHTML = noti.map(n => {
                // 1. 아이콘을 담을 변수 선언
                let iconTag = '<i data-lucide="alert-triangle" style="color: #ef4444;"></i>';

                // 3. 생성된 iconTag를 템플릿 리터럴에 삽입
                return `
                    <div class="notif-item ${n.is_read ? '' : 'unread'}" 
                        onclick="readItem(${n.signal_no})" 
                        style="cursor: pointer;">
                        <div class="notif-icon">
                            ${iconTag}
                        </div>
                        <div class="notif-content">
                            <div class="notif-title">3단계 signal ${n.risk_level} 알림</div>
                            <div class="notif-message">${n.prediction}</div>
                            <div class="notif-time">${timeAgo(n.signal_time)} ${n.is_read ? '' : '<span class="unread-dot"></span>'}</div>
                        </div>
                        <div class="notif-delete" 
                            onclick="deleteItem(event, ${n.signal_no})" 
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; padding: 5px;">
                            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                        </div>
                    </div>
                    `;               
            }).join('')+`<div class="hover:cursor-pointer" style="padding: 5px; text-align: center; color: #9ca3af;" onclick=allRead()>
                            모두읽음
                        </div>`;
            lucide.createIcons();
        }

        // 아이콘 매칭 함수
        function getIcon(type) {
            return 'user';
        }

        // 아이템 클릭 (읽음 처리 및 이동)
        async function readItem(id) {
            noti = noti.map(n => {
                if (n.id === id) {
                    // ID가 일치하면 읽음 처리된 복사본 반환
                    return { ...n, is_read: 1 };
                } else {
                    // ID가 일치하지 않으면 기존 데이터 그대로 반환
                    return n;
                }
            });
            await axios.post("/noti/read", {"id": id, "user_id": savedUserId});
            updateNotifUI();
            location.href = 'signal_log.html';
        }

        // 아이템 삭제
        async function deleteItem(e, id) {
            e.stopPropagation();
            noti = noti.map(n => {
                if (n.id === id) {
                    // ID가 일치하면 읽음 처리된 복사본 반환
                    return { ...n, is_read: 1 };
                } else {
                    // ID가 일치하지 않으면 기존 데이터 그대로 반환
                    return n;
                }
            });
            await axios.post("/noti/read", {"id": id, "user_id": savedUserId});
            updateNotifUI();
        }

        // 모두 읽음
        async function allRead() {
            noti = noti.map(n => ({...n, is_read: 1}));
            await axios.get("/noti/read_all?id="+savedUserId);
            updateNotifUI();
        }

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            fetchSignals();
            lucide.createIcons();
