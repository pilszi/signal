<!DOCTYPE html>
<html lang="ko">
    <head>
        <script>
            (function checkAuth() {
                // 1. 세션 스토리지에서 아이디 확인
                const savedUserId = sessionStorage.getItem("savedUserId");
                
                // 2. 로그인 여부 판단 (값이 없거나 'guest'인 경우)
                if (!savedUserId || savedUserId === "guest" || savedUserId === "null") {
                    // 로그인 안 됨: 경고창을 띄우고 로그인 페이지로 이동
                    alert("로그인 후 이용해주세요.");
                    location.href = "login.html";
                    
                    // 페이지 본문이 보이지 않도록 즉시 중단 (일종의 가드)
                    document.documentElement.style.display = 'none';
                }
            })();
     </script>   
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>시그널 로그</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            .notif-container {
                position: relative;
                display: inline-block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */
                position: relative;
                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */
            .notif-footer {
                padding: 12px;
                text-align: center;
                background-color: #f9fafb;
            }

            .all-read-btn {
                background: none;
                border: none;
                color: #2563eb;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }

            .all-read-btn:hover { text-decoration: underline; }

            .report-card {
                padding: 24px;
                border-radius: 16px;
                margin-bottom: 16px;
                line-height: 1.5;
                transition: all 0.3s ease;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            }

            .risk-severe {
                background-color: #fff1f0;
                border: 2px solid #ff4d4f;
                color: #820014;
            }

            .risk-warning {
                background-color: #fffbe6;
                border: 2px solid #ffc53d;
                color: #874d00;
            }

            .risk-stable {
                background-color: #e6f7ff;
                border: 2px solid #40a9ff;
                color: #003a8c;
            }

        </style>
    </head>
    <body class="bg-gray-50 text-gray-900">
        <nav class="border-b bg-white sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <div class="flex items-center gap-8">
                        <a href="main.html" class="flex items-center gap-2">
                            <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">Signal</span>
                        </a>
                        <div class="hidden md:flex gap-1">
                            <a href="main.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">글로벌 현황</a>
                            <a href="custom_news.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">맞춤형 뉴스</a>
                            <a href="signal_log.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">시그널 로그</a>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="user-greeting" class="hidden text-sm text-gray-600"><span id="user_name"></span>님 반갑습니다</span>
                        <div class="notif-container" id="notifContainer">
                            <button class="notif-trigger rounded-lg hover:bg-gray-100 text-blue-600" id="notifTrigger">
                                <i data-lucide="bell" class="w-5 h-5"></i>
                                <span class="notif-badge" id="notifBadge" style="display: none;"></span>
                            </button>

                            </div>
                        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">시그널 로그</h1>
                <p class="text-sm text-gray-500">최근 발생한 AI 리스크 분석 리포트입니다.</p>
            </div>

            <div id="filter-container" class="flex items-center gap-3 mb-6 flex-wrap">
                <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                <button onclick="filterLevel('전체')" class="px-4 py-2 rounded-lg bg-gray-600 text-white">전체</button>
                <button onclick="filterLevel('3단계(심각)')" class="px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100">3단계 (심각)</button>
                <button onclick="filterLevel('2단계(주의)')" class="px-5 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100">2단계 (주의)</button>
                <button onclick="filterLevel('1단계(안정)')" class="px-5 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100">1단계 (안정)</button>
            </div>

            <div class="grid lg:grid-cols-4 gap-8">
                <div class="lg:col-span-3">
                    <div id="signal-list" class="grid gap-4">
                        </div>
                    <div id="pagination" class="mt-8 flex items-center justify-center gap-2"></div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white border rounded-xl p-5 shadow-sm sticky top-24">
                        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <i data-lucide="bell-ring" class="w-4 h-4 text-red-500"></i> 실시간 주요 시그널
                        </h3>
                        <div id="signal-log-container" class="space-y-4 max-h-[600px] overflow-y-auto">
                            <p class="text-xs text-gray-400 text-center py-4">동기화 중...</p>
                        </div>
                    </div>
                </div>
            </div>

    <script>
        // 1. 상태 관리 변수
        let allSignals = [];      // 상세 로그 리스트용
        let filteredSignals = [];  // 필터 적용된 데이터
        let currentPage = 1;
        const SIGNALS_PER_PAGE = 10;
        let selectedLevel = null;
        let savedUserId = sessionStorage.getItem("savedUserId");
        let noti = [];            // 실시간 사이드바 및 알림용

        // 시그널 컬러 테마
        const levelStyles = {
            "심각": { bg: "bg-[#FFF0F0]", border: "border-red-400", badge: "bg-red-500", text: "text-red-800" },
            "주의": { bg: "bg-[#FFFBEB]", border: "border-yellow-400", badge: "bg-yellow-500", text: "text-yellow-800" },
            "안정": { bg: "bg-[#F0F7FF]", border: "border-blue-400", badge: "bg-blue-500", text: "text-blue-800" }
        };

        // 2. 데이터 가져오기 통합 (상세 로그 + 알림 데이터)
        async function refreshAllData() {
            try {
                const [signalsRes, notiRes] = await Promise.all([
                    axios.get('/signal_log?id=' + savedUserId),
                    axios.get("/noti/signal?id=" + savedUserId)
                ]);

                allSignals = signalsRes.data.data;
                noti = notiRes.data.data;

                applyFilterAndRender(); // 메인 리스트 렌더링
                updateNotifUI_Static(); // 알림 배지 및 사이드바 렌더링
            } catch (error) {
                console.error("데이터 동기화 실패:", error);
            }
        }

        // 3. 필터링 및 메인 리스트 렌더링
        function applyFilterAndRender() {
            // 1. 필터링 로직
            if (!selectedLevel || selectedLevel === '전체') {
                // '전체'일 경우 모든 시그널 표시
                filteredSignals = [...allSignals];
            } else {
                // selectedLevel이 '심각', '주의', '안정'으로 들어오므로 데이터와 바로 비교
                // .includes()를 사용하면 '심각'이 포함된 모든 등급을 안전하게 찾아냅니다.
                filteredSignals = allSignals.filter(s => s.risk_level.includes(selectedLevel));
            }

            // 2. 최신순 정렬
            filteredSignals.sort((a, b) => new Date(b.signal_time) - new Date(a.signal_time));

            // 3. 화면 렌더링 호출
            renderSignalList();
            renderPagination();
        }

        // 4. 리스크 레벨 클래스 결정
        function getRiskClass(level) {
            if (level === '심각') return 'risk-severe';
            if (level === '주의') return 'risk-warning';
            return 'risk-stable';
        }

        // 5. 상세 리스트 렌더링
        function renderSignalList() {
            const listContainer = document.getElementById('signal-list');
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const currentSignals = filteredSignals.slice(startIndex, startIndex + SIGNALS_PER_PAGE);

            if (currentSignals.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white p-20 rounded-xl text-center text-gray-400 border border-dashed">
                        일치하는 시그널 로그가 없습니다.
                    </div>`;
                return;
            }

            listContainer.innerHTML = currentSignals.map(signal => {
            // 컬러 테마 적용
            const style = levelStyles[signal.risk_level] || levelStyles["안정"];

            return `
                <div class="${style.bg} border-2 ${style.border} rounded-2xl p-8 mb-6 shadow-sm transition-all hover:shadow-md">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-bold text-gray-500">${signal.signal_time.replace('T', ' ')}</span>
                            <span class="${style.badge} text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">
                                ${signal.risk_level}
                            </span>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold ${style.text} mb-6 underline decoration-current/20 underline-offset-8">
                        ${signal.prediction}
                    </h3>

                    <div class="space-y-5 text-sm">
                        <div>
                            <p class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-tight">예측 근거</p>
                            <p class="text-gray-800 font-medium leading-relaxed">${signal.prediction_reason}</p>
                        </div>
                        <div class="pt-3 border-t border-current/10">
                            <p class="text-gray-500 font-bold mb-1 text-xs uppercase tracking-tight">예측</p>
                            <p class="text-gray-800 font-medium leading-relaxed">${signal.prediction}</p>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between items-center">
                        <a href="${signal.url}" target="_blank" class="text-blue-600 text-xs font-bold flex items-center gap-1 hover:underline">
                            기사 원문 보기 <i data-lucide="external-link" class="w-3 h-3"></i>
                        </a>
                        <div class="flex gap-1">
                            ${(signal.match_keyword || []).map(kw => `
                                <span class="text-[10px] bg-white/60 px-2 py-0.5 rounded border border-gray-200 text-gray-500 font-medium">#${kw}</span>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        if (window.lucide) lucide.createIcons();
    }

        // 6. 실시간 사이드바 렌더링
        function renderSignalLogs() {
            const logs = noti.filter(n => n.risk_level === "심각" || n.risk_level === "주의");
            const container = document.getElementById('signal-log-container');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">안정적인 상태입니다.</p>';
                return;
            }

            container.innerHTML = logs.slice(0, 5).map(log => `
                <div class="p-3 border-b last:border-0 hover:bg-gray-50 transition-colors cursor-pointer rounded-lg" onclick="location.href='signal_log.html'">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-bold ${log.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} uppercase">[${log.risk_level}]</span>
                        <span class="text-[9px] text-gray-400">${timeAgo(log.signal_time)}</span>
                    </div>
                    <p class="text-xs font-semibold text-gray-800 mb-1 line-clamp-1">${log.prediction}</p>
                </div>
            `).join('');
        }

        // 7. 알림 UI 업데이트 (데이터 호출 없이 UI만 갱신)
        function updateNotifUI_Static() {
            const badge = document.getElementById('notifBadge');
            const unreads = noti.filter(n => !n.is_read);

            if (unreads.length > 0) {
                badge.innerText = unreads.length;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            document.getElementById('notifCountText').innerText = `${unreads.length}개의 새 알림`;
            renderList(document.getElementById('notifList'), noti);
            renderSignalLogs();
            if (window.lucide) lucide.createIcons();
        }

        // HTML과 연결되는 유일한 필터 함수
        function filterLevel(level) {
            // 1. 전역 상태 업데이트 (전체일 경우 null 처리)
            selectedLevel = (level === '전체') ? null : level;
            currentPage = 1;

            // 2. 필터 버튼 시각적 피드백 (Tailwind 클래스 직접 조작)
            document.querySelectorAll('#filter-container button').forEach(btn => {
                const btnText = btn.innerText;

                // 클릭한 버튼과 텍스트가 일치하거나, '전체' 버튼을 누른 경우 강조
                if ((level === '전체' && btnText === '전체') || (level !== '전체' && btnText.includes(level))) {
                    btn.className = "px-4 py-2 rounded-lg bg-gray-900 text-white font-bold shadow-md transition-all";
                } else {
                    // 나머지 버튼들은 원래의 등급별 색상으로 복원
                    if (btnText.includes('심각')) btn.className = "px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors";
                    else if (btnText.includes('주의')) btn.className = "px-5 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition-colors";
                    else if (btnText.includes('안정')) btn.className = "px-5 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors";
                    else btn.className = "px-4 py-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors";
                }
            });

            // 3. 필터 적용 및 화면 다시 그리기 (핵심!)
            applyFilterAndRender();
        }

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                await axios.get("/logout");
                sessionStorage.clear();
                location.href = "login.html";
            }
        }

        // 10. 유틸리티 및 페이지네이션
        function timeAgo(dateString) {
            const diff = Math.floor((new Date() - new Date(dateString)) / 1000);
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
            return dateString.split('T')[0];
        }



        function handlePageChange(page) {
            currentPage = page;
            renderSignalList();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredSignals.length / SIGNALS_PER_PAGE);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button onclick="handlePageChange(${currentPage-1})" ${currentPage===1?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage===i?'bg-blue-600 text-white':'hover:bg-gray-50'}">${i}</button>`;
            }
            html += `<button onclick="handlePageChange(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>`;
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        // 11. 알림 리스트 드롭다운 렌더링
        function renderList(container, data) {
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-400">알림이 없습니다.</div>';
                return;
            }
            // 알림창 출력 필드
            container.innerHTML = data.map(n => `
                <div class="notif-item p-4 border-b relative ${n.is_read ? '' : 'bg-blue-50 hover:bg-blue-100'}" onclick="readItem(${n.id})">
                    <div class="text-xs font-bold ${n.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} mb-1">
                        ${n.risk_level} 단계 알림
                    </div>

                    <div class="text-sm text-gray-800 mb-1 pr-6">${n.prediction}</div>

                    <div class="text-[10px] text-gray-400">${timeAgo(n.signal_time)}</div>

                    <button onclick="deleteItem(event, ${n.id})" class="absolute right-2 top-4 p-1 text-gray-300 hover:text-gray-500">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('') + `
                <div class="p-3 text-center bg-gray-50">
                    <button onclick="allRead()" class="text-xs text-blue-600 hover:underline">모두 읽음으로 처리</button>
                </div>`;
        }

        // 스크립트 아무 곳에나 추가
        function updateNavbar() {
            const savedUserId = sessionStorage.getItem("savedUserId");
            const userNameElement = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');

            if (savedUserId && userNameElement) {
                userNameElement.innerText = savedUserId;
                userGreeting.classList.remove('hidden');
            }
        }

        // 12. 초기 실행 및 실시간 폴링
        document.addEventListener('DOMContentLoaded', async () => {
            updateNavbar();
            axios.get("/session_out");

            await refreshAllData();

            setInterval(async () => {
                console.log("🔄 시그널 로그 실시간 동기화 중...");
                await refreshAllData();
            }, 30000);

            // 네비바 하이라이트
            const currentPath = window.location.pathname.split("/").pop() || "signal_log.html";
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('href').split("/").pop() === currentPath) {
                    item.classList.add('bg-blue-50', 'text-blue-600');
                }
            });

            // 드롭다운 토글 제어
            const trigger = document.getElementById('notifTrigger');
            const dropdown = document.getElementById('notifDropdown');
            if (trigger && dropdown) {
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!document.getElementById('notifContainer').contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
            // 6. 아이콘 최종 렌더링
            if (window.lucide) lucide.createIcons();
        });
    </script>
</html>
