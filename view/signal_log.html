<!DOCTYPE html>
<html lang="ko">
    <head>
        <script>
            (function checkAuth() {
                // 1. 세션 스토리지에서 아이디 확인
                const savedUserId = sessionStorage.getItem("savedUserId");
                
                // 2. 로그인 여부 판단 (값이 없거나 'guest'인 경우)
                if (!savedUserId || savedUserId === "guest" || savedUserId === "null") {
                    // 로그인 안 됨: 경고창을 띄우고 로그인 페이지로 이동
                    alert("로그인 후 이용해주세요.");
                    location.href = "login.html";
                    
                    // 페이지 본문이 보이지 않도록 즉시 중단 (일종의 가드)
                    document.documentElement.style.display = 'none';
                }
            })();
     </script>   
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>시그널 로그</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            .notif-container {
                position: relative;
                display: inline-block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
        .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */
                position: relative;
                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */
            .notif-footer {
                padding: 12px;
                text-align: center;
                background-color: #f9fafb;
            }

            .all-read-btn {
                background: none;
                border: none;
                color: #2563eb;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }

            .all-read-btn:hover { text-decoration: underline; }

            .report-card {
                padding: 24px;
                border-radius: 16px;
                margin-bottom: 16px;
                white-space: pre-wrap;
                line-height: 1.6;
                transition: all 0.3s ease;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            }

            .risk-severe {
                background-color: #fff1f0;
                border: 2px solid #ff4d4f;
                color: #820014;
            }

            .risk-warning {
                background-color: #fffbe6;
                border: 2px solid #ffc53d;
                color: #874d00;
            }

            .risk-stable {
                background-color: #e6f7ff;
                border: 2px solid #40a9ff;
                color: #003a8c;
            }

        </style>
    </head>
    <body class="bg-gray-50 text-gray-900">
        <nav class="border-b bg-white sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <div class="flex items-center gap-8">
                        <a href="main.html" class="flex items-center gap-2">
                            <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">Signal</span>
                        </a>
                        <div class="hidden md:flex gap-1">
                            <a href="main.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">글로벌 현황</a>
                            <a href="custom_news.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">맞춤형 뉴스</a>
                            <a href="signal_log.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">시그널 로그</a>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="user-greeting" class="hidden text-sm text-gray-600"><span id="user_name"></span>님 반갑습니다</span>
                        <div class="notif-container" id="notifContainer">
                            <button class="notif-trigger rounded-lg hover:bg-gray-100 text-blue-600" id="notifTrigger">
                                <i data-lucide="bell" class="w-5 h-5"></i>
                                <span class="notif-badge" id="notifBadge" style="display: none;"></span>
                            </button>
                            <div class="notif-dropdown hidden" id="notifDropdown">
                                <div class="notif-header p-4 border-b"><span id="notifCountText" class="text-sm text-gray-500"></span></div>
                                <div id="notifList"></div>
                            </div>
                        </div>
                        <a href="profile.html" class="nav-item p-2 rounded-lg hover:bg-gray-100 text-blue-600"><i data-lucide="user" class="w-5 h-5"></i></a>
                        <div id="authContainer"></div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">시그널 로그</h1>
                <p class="text-sm text-gray-500">최근 발생한 AI 리스크 분석 리포트입니다.</p>
            </div>

            <div id="filter-container" class="flex items-center gap-3 mb-6 flex-wrap">
                <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                <button onclick="handleLevelFilter(null)" class="filter-btn px-4 py-2 rounded-lg bg-gray-900 text-white">전체</button>
                <button onclick="handleLevelFilter('심각')" class="filter-btn px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100">3단계 (심각)</button>
                <button onclick="handleLevelFilter('주의')" class="filter-btn px-4 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100">2단계 (주의)</button>
                <button onclick="handleLevelFilter('안정')" class="filter-btn px-4 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100">1단계 (안정)</button>
            </div>

            <div class="grid lg:grid-cols-4 gap-8">
                <div class="lg:col-span-3">
                    <div id="signal-list" class="grid gap-4">
                        </div>
                    <div id="pagination" class="mt-8 flex items-center justify-center gap-2"></div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-white border rounded-xl p-5 shadow-sm sticky top-24">
                        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <i data-lucide="bell-ring" class="w-4 h-4 text-red-500"></i> 실시간 주요 시그널
                        </h3>
                        <div id="signal-log-container" class="space-y-4 max-h-[600px] overflow-y-auto">
                            <p class="text-xs text-gray-400 text-center py-4">동기화 중...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
    <script>
        // 1. 상태 관리 변수
        let allSignals = [];      // 상세 로그 리스트용
        let filteredSignals = [];  // 필터 적용된 데이터
        let currentPage = 1;
        const SIGNALS_PER_PAGE = 10;
        let selectedLevel = null;
        let savedUserId = sessionStorage.getItem("savedUserId");
        let noti = [];            // 실시간 사이드바 및 알림용

        // 2. 데이터 가져오기 통합 (상세 로그 + 알림 데이터)
        async function refreshAllData() {
            try {
                const [signalsRes, notiRes] = await Promise.all([
                    axios.get('/signal_log?id=' + savedUserId),
                    axios.get("/noti/signal?id=" + savedUserId)
                ]);

                allSignals = signalsRes.data.data;
                noti = notiRes.data.noti;

                applyFilterAndRender(); // 메인 리스트 렌더링
                updateNotifUI_Static(); // 알림 배지 및 사이드바 렌더링
            } catch (error) {
                console.error("데이터 동기화 실패:", error);
            }
        }

        // 3. 필터링 및 메인 리스트 렌더링
        function applyFilterAndRender() {
            filteredSignals = selectedLevel
                ? allSignals.filter(s => s.risk_level === selectedLevel)
                : allSignals;

            // 최신순 정렬 (데이터 필드명 확인: signal_time 또는 analyzed_at)
            filteredSignals.sort((a, b) => new Date(b.signal_time || b.analyzed_at) - new Date(a.signal_time || a.analyzed_at));

            renderSignalList();
            renderPagination();
        }

        // 4. 리스크 레벨 클래스 결정
        function getRiskClass(level) {
            if (level === '심각') return 'risk-severe';
            if (level === '주의') return 'risk-warning';
            return 'risk-stable';
        }

        // 5. 상세 리스트 렌더링
        function renderSignalList() {
            const listContainer = document.getElementById('signal-list');
            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const currentSignals = filteredSignals.slice(startIndex, startIndex + SIGNALS_PER_PAGE);

            if (currentSignals.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white p-10 rounded-xl text-center text-gray-500 border border-dashed">
                        조회된 시그널 로그가 없습니다.
                    </div>`;
                return;
            }

            listContainer.innerHTML = currentSignals.map(signal => `
                <div class="report-card ${getRiskClass(signal.risk_level)}">
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-white/50 border border-current">
                            ${signal.risk_level} 단계 시그널
                        </span>
                        <span class="text-xs opacity-70 font-medium">${signal.signal_time ? signal.signal_time.split('T')[0] : '날짜 미상'}</span>
                    </div>
                    <div class="mb-5">
                        <p class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1">상황 요약</p>
                        <p class="text-xl font-bold leading-snug">${signal.prediction || '정보 없음'}</p>
                    </div>
                    <div class="border-t border-current/10 pt-4">
                        <p class="text-xs font-bold uppercase tracking-wider opacity-60 mb-2">전략적 분석</p>
                        <p class="text-base font-medium leading-relaxed">${signal.prediction_reason || '분석 데이터 없음'}</p>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        // 6. 실시간 사이드바 렌더링
        function renderSignalLogs() {
            const logs = noti.filter(n => n.risk_level === "심각" || n.risk_level === "주의");
            const container = document.getElementById('signal-log-container');
            if (!container) return;

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">안정적인 상태입니다.</p>';
                return;
            }

            container.innerHTML = logs.slice(0, 5).map(log => `
                <div class="p-3 border-b last:border-0 hover:bg-gray-50 transition-colors cursor-pointer rounded-lg" onclick="location.href='signal_log.html'">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-bold ${log.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} uppercase">[${log.risk_level}]</span>
                        <span class="text-[9px] text-gray-400">${timeAgo(log.signal_time)}</span>
                    </div>
                    <p class="text-xs font-semibold text-gray-800 mb-1 line-clamp-1">${log.prediction}</p>
                </div>
            `).join('');
        }

        // 7. 알림 UI 업데이트 (데이터 호출 없이 UI만 갱신)
        function updateNotifUI_Static() {
            const badge = document.getElementById('notifBadge');
            const unreads = noti.filter(n => !n.is_read);

            if (unreads.length > 0) {
                badge.innerText = unreads.length;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
            document.getElementById('notifCountText').innerText = `${unreads.length}개의 새 알림`;
            renderList(document.getElementById('notifList'), noti);
            renderSignalLogs();
            if (window.lucide) lucide.createIcons();
        }

        // 8. 알림 상호작용 기능 (추가된 부분)
        async function readItem(id) {
            noti = noti.map(n => {
                if (n.signal_no === id) return { ...n, is_read: 1 };
                return n;
            });
            await axios.post("/noti/read", { "id": id, "user_id": savedUserId });
            updateNotifUI_Static();
            location.href = 'signal_log.html';
        }

        async function deleteItem(e, id) {
            e.stopPropagation();
            noti = noti.filter(n => n.signal_no !== id);
            await axios.post("/noti/read", { "id": id, "user_id": savedUserId });
            updateNotifUI_Static();
        }

        async function allRead() {
            noti = noti.map(n => ({ ...n, is_read: 1 }));
            await axios.get("/noti/read_all?id=" + savedUserId);
            updateNotifUI_Static();
        }

        // 9. 네비바 및 공통 기능
        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            const userNameSpan = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');

            if (savedUserId && savedUserId !== 'guest' && savedUserId !== 'null') {
                if (userNameSpan) userNameSpan.textContent = savedUserId;
                if (userGreeting) userGreeting.classList.remove('hidden');
                authContainer.innerHTML = `
                    <button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase transition-colors">
                        LOG OUT
                    </button>
                `;
            } else {
                if (userGreeting) userGreeting.classList.add('hidden');
                authContainer.innerHTML = `
                    <a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase transition-colors">
                        LOG IN
                    </a>
                `;
            }
        }

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                await axios.get("/logout");
                sessionStorage.clear();
                location.href = "login.html";
            }
        }

        // 10. 유틸리티 및 페이지네이션
        function timeAgo(dateString) {
            const diff = Math.floor((new Date() - new Date(dateString)) / 1000);
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
            return dateString.split('T')[0];
        }

        function handleLevelFilter(level) {
            selectedLevel = level;
            currentPage = 1;

            // 필터 버튼 시각적 피드백 (선택된 버튼 강조)
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnLevel = btn.getAttribute('data-level');
                if ((level === null && btnLevel === 'all') || (level !== null && btnLevel == (level === '심각' ? 3 : level === '주의' ? 2 : 1))) {
                    btn.classList.add('bg-gray-900', 'text-white');
                    btn.classList.remove('bg-gray-100', 'text-gray-600');
                } else {
                    btn.classList.remove('bg-gray-900', 'text-white');
                    // 각 등급별 연한 배경색 유지 로직은 필요에 따라 조정
                }
            });

            applyFilterAndRender();
        }

        function handlePageChange(page) {
            currentPage = page;
            renderSignalList();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredSignals.length / SIGNALS_PER_PAGE);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button onclick="handlePageChange(${currentPage-1})" ${currentPage===1?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage===i?'bg-blue-600 text-white':'hover:bg-gray-50'}">${i}</button>`;
            }
            html += `<button onclick="handlePageChange(${currentPage+1})" ${currentPage===totalPages?'disabled':''} class="p-2 border rounded-lg hover:bg-gray-50"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>`;
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        // 11. 알림 리스트 드롭다운 렌더링
        function renderList(container, data) {
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = '<div class="p-10 text-center text-gray-400">알림이 없습니다.</div>';
                return;
            }
            container.innerHTML = data.map(n => `
                <div class="notif-item p-4 border-b relative ${n.is_read ? '' : 'bg-blue-50 hover:bg-blue-100'}" onclick="readItem(${n.signal_no})">
                    <div class="text-xs font-bold ${n.risk_level === '심각' ? 'text-red-600' : 'text-yellow-600'} mb-1">${n.risk_level} 단계 알림</div>
                    <div class="text-sm text-gray-800 mb-1 pr-6">${n.prediction}</div>
                    <div class="text-[10px] text-gray-400">${timeAgo(n.signal_time)}</div>
                    <button onclick="deleteItem(event, ${n.signal_no})" class="absolute right-2 top-4 p-1 text-gray-300 hover:text-gray-500">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('') + `
                <div class="p-3 text-center bg-gray-50">
                    <button onclick="allRead()" class="text-xs text-blue-600 hover:underline">모두 읽음으로 처리</button>
                </div>`;
        }

        // 12. 초기 실행 및 실시간 폴링
        document.addEventListener('DOMContentLoaded', async () => {
            updateNavbar();
            axios.get("/session_out");

            await refreshAllData();

            setInterval(async () => {
                console.log("🔄 시그널 로그 실시간 동기화 중...");
                await refreshAllData();
            }, 30000);

            // 네비바 하이라이트
            const currentPath = window.location.pathname.split("/").pop() || "signal_log.html";
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('href').split("/").pop() === currentPath) {
                    item.classList.add('bg-blue-50', 'text-blue-600');
                }
            });

            // 드롭다운 토글 제어
            const trigger = document.getElementById('notifTrigger');
            const dropdown = document.getElementById('notifDropdown');
            if (trigger && dropdown) {
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!document.getElementById('notifContainer').contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }
            // 6. 아이콘 최종 렌더링
