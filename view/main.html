<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signal - 세계 리스크 히트맵</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            /* 지도 내 국가 호버 효과 */
            .country-path:hover {
                opacity: 0.8;
                cursor: pointer;
            }
            .selected-country {
                stroke: #2563eb;
                stroke-width: 2px;
            }
            .notif-container {
                position: relative;
                display: inline-block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }

            .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */
                position: relative;
                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */
            .notif-footer {
                padding: 12px;
                text-align: center;
                background-color: #f9fafb;
            }

            .all-read-btn {
                background: none;
                border: none;
                color: #2563eb;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
            }

            .all-read-btn:hover { text-decoration: underline; }
        </style>
    </head>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

                <!-- 왼쪽/중앙 컬럼 (지도 & 뉴스) -->

                    <!-- 히트맵 카드 -->

                        <div class="flex items-center justify-between mb-4">
                            <div>

                    <!-- 뉴스 카드 그리드 -->

                <!-- 오른쪽 사이드바 (고정) -->

    <script>
        // 지역 키워드 발생 시 불이 들어올 국가 리스트
        const REGION_MAP = {
        "EU": {
            label: "EU",
            countries: ["France", "Germany", "Italy", "Spain", "Netherlands"]
        },
        "ASEAN": {
            label: "ASEAN",
            countries: ["Vietnam", "Indonesia", "Thailand", "Philippines"]
        },
        "Middle East": {
            label: "Middle East",
            countries: ["Israel", "Iran", "Saudi Arabia", "UAE"]
        },
        "East Asia": {
            label: "East Asia",
            countries: ["Korea", "China", "Japan", "Taiwan", "North Korea"]
        },
        "Strait of Hormuz": {
            label: "Strait of Hormuz",
            countries: ["Iran", "UAE", "Oman", "Saudi Arabia"]
        },
        "Red Sea": {
            label: "Red Sea",
            countries: ["Egypt", "Saudi Arabia", "Yemen"]
        },
        "South China Sea": {
            label: "Middle East",
            countries: ["China", "Philippines", "Vietnam", "Malaysia"]
        },
        "G20": {
            label: "G20",
            countries: ["United States", "China", "Japan", "Germany", "United Kingdom",
                          "France", "Italy", "Canada", "South Korea", "India",
                          "Russia", "Brazil", "Australia", "Indonesia", "Mexico",
                          "Saudi Arabia", "Turkey", "South Africa", "Argentina"]
        },
        "Global": {
            label: "Global",
            countries: ["United States", "China", "Japan", "Germany", "France",
                        "United Kingdom", "Russia", "India", "Brazil"]
        },
    };

        // 영어로 표시용 정규화 함수
        function normalizeCountry(name) {
            if (!name) return "Global";

            if (typeof name === "string") return name;

            return "Global";
        }



        // --- 1. 전역 상태 관리 ---
        let allSignals = [];      // 하단 뉴스 그리드용 (전체 뉴스)
        let filteredNews = [];    // 필터링된 뉴스
        let heatmapData = [];     // 서버에서 받은 리스크 통계 ({score, level})
        // 초기 상태 데이터
        let savedUserId = sessionStorage.getItem('savedUserId');
        let selectedCountry = null;
        let startDate = null;
        let endDate = null;
        let searchQuery = "";
        let calendarMonth = new Date(2026, 4); // 2026년 5월
        let myChart = echarts.init(document.getElementById('map'));
        let noti = [];
        const SIGNALS_PER_PAGE = 10;
        let currentPage = 1;
        let countryMap ={};
        const infoBox = document.getElementById('selected-country-info');
        const trigger = document.getElementById('notifTrigger');
        const dropdown = document.getElementById('notifDropdown');
        const list = document.getElementById('notifList');


        let dateFilter = "";

        // 히트맵 데이터를 분석하여 지도에 색상을 입히는 함수
        function updateHeatmap(data) {
            // 💡 혹시 리더님의 차트 인스턴스 변수명이 'myChart'가 아니라 'chart'나 'mapChart'인지 꼭 확인해 보세요!
            if (typeof myChart === "undefined" || !myChart) {
                console.error("❌ [디버그] ECharts 인스턴스(myChart)를 찾을 수 없습니다. 변수명을 확인해주세요.");
                return;
            }

            // 💡 글로벌 변수 heatmapData가 안전하게 존재하는지 한 번 더 검증
            if (!heatmapData || heatmapData.length === 0) {
                console.warn("⚠️ [디버그] 차트에 주입할 heatmapData 배열이 비어있습니다.");
                return;
            }

            // 🎯 ECharts의 첫 번째 시리즈(index: 0)인 지도 레이어에 데이터를 명시적으로 동기화합니다.
            myChart.setOption({
                series: [{
                    type: 'map', // 👈 이 문구를 적어주어야 기존 지도 레이어와 정확하게 병합됩니다.
                    data: data
                }]
            });

            console.log("🎯 [디버그] ECharts 엔진에 맞춤형 점수 주입 완료!", data);
        }
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });
        }

        // 페이지 오픈시 실행
        document.addEventListener('DOMContentLoaded', async() => {
            axios.get("/session_out");
            updateNavbar();
            // 1. 국가명 매핑 먼저
            await loadCountryMap();
            // 2. 지도 생성
            await initMap();
            // 3. 데이터 가져오기 + heatmap 적용
            await fetchMainData();

            // 4. 나머지 ui
            renderExchangeRates();
            initCalendar();
            lucide.createIcons();

            await updateNotifUI();

            renderNews();
            renderPagination();

            updateStation();
<!--            loadCountryMap();-->
            updateRefreshTime();
            scheduleNextUpdate();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    executeScrollToCard();
                });
            });
        });

        async function fetchMainData(date = null) {
            try {
                let newsUrl = "/public_signals" + (date ? `?date=${date}` : "");

                // 4개의 API를 호출하므로 4개의 변수로 받습니다.
                const [newsRes, indicatorRes, countryRes] = await Promise.all([
                    axios.get(newsUrl),
                    axios.get('/api/market-indicators'),
                    axios.get('/main/country')
                ]);
                console.log(newsRes, indicatorRes, countryRes);

                // 1. 뉴스 데이터 설정 (변수명 통일: newsRes)
                allSignals = newsRes.data.msg || [];
                filteredNews = [...allSignals];

                // 2. 히트맵 데이터 가공 (MariaDB 데이터 우선 사용)
                if (countryRes.data && countryRes.data.country_signal) {
                    heatmapData = countryRes.data.country_signal.map(item => {

                        return {
                            name: item.en_name,
                            value: item.total_score,
                            total_score: item.total_score,
                            level: item.total_score >= 300 ? "심각" : (item.total_score >= 200 ? "주의" : "안정")
                        };
                    });
                    updateHeatmap(heatmapData); // 히트맵 갱신
                }

                // 3. 환율 데이터 렌더링
                if (indicatorRes.data.status === "success") {
                    renderExchangeRates(indicatorRes.data.data);
                }

                // 4. UI 갱신
                if (date) currentPage = 1;
                renderNews();
                renderPagination();
                updateStation();
                updateNotifUI();

            } catch (error) {
                console.error("데이터 통합 로드 실패:", error);
            }
        }

        // Navbar 상태 업데이트
        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            // 태그가 없을 시 함수 종료(에러방지)
            // console.log(authContainer);
            if (!authContainer){return};
            const userGreeting = document.getElementById('user-greeting');

            if (userGreeting && savedUserId && savedUserId !== 'guest' && savedUserId !== 'null') {
                // 1. 인사말 영역 처리
                // 관리자 계정일 경우
                if (savedUserId === 'admin') {
                    userGreeting.innerHTML = `
                        <div class="text-sm text-gray-600">
                            <a href="admin.html" class="px-1 hover:bg-blue-300 transition-colors rounded-md">관리자님</a>
                                반갑습니다
                        </div>
                        `
                // 회원 계정일 경우
                } else {

        // signal 분석 시간 변화 함수(예. 방금전, 30분전, 1시간전...)
        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return '방금 전';

            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;

            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;

            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;

            // 일주일이 넘어가면 그냥 원래 날짜(년-월-일)를 보여줍니다.
            return dateString.split('T')[0];
        }

                        ${d}
                    </button>
                `;
            }
        }

        function changeMonth(step) {
            calendarMonth.setMonth(calendarMonth.getMonth() + step);
            initCalendar();
        }



        function selectDate(day) {

            const year = calendarMonth.getFullYear();
            const month = String(calendarMonth.getMonth() + 1).padStart(2, '0');
            const date = String(day).padStart(2, '0');
            const dateStr = `${year}-${month}-${date}`;

            // 시작일, 끝일 모두 선택 안됐을 때
            if (!startDate || (startDate && endDate)) {
                startDate = dateStr;
                endDate = null;
                // 여기서는 toggleCalendar()를 절대 호출하지 않습니다. (계속 열려있어야 함)
            }
            // 시작일만 선택된 상태에서 두 번째 날짜를 클릭할 때
            else {
                if (dateStr < startDate) {
                    // 선택한 날짜가 시작일보다 빠르면 시작일을 이 날짜로 교체 (종료일은 여전히 null)
                    startDate = dateStr;
                    endDate = null;
                    // 시작일이 바뀌었을 뿐이므로 닫지 않습니다.
                } else if (dateStr === startDate) {
                    // 시작일을 한 번 더 누르면 선택 취소 (개발자 취향에 따라 선택)
                    startDate = null;
                    endDate = null;
                } else {
                    // 드디어 정상적인 종료일 선택!
                    endDate = dateStr;
                    toggleCalendar();
                }
            }
            updateDateDisplay();
            applyFilters();
        }

        function updateDateDisplay(){
            const display = document.getElementById('date-display');

            if (!startDate) {
                display.innerText = "날짜를 선택해주세요";
                display.classList.add('text-gray-400');
            } else if (!endDate) {
                // 시작일만 있을 때
                display.innerText = `${startDate} ~ 시작일 선택됨`;
                display.classList.remove('text-gray-400');
            } else {
                // 기간이 모두 선택되었을 때
                display.innerText = `${startDate} ~ ${endDate}`;
                display.classList.remove('text-gray-400');
            }
        }

        // 페이지네이션 렌더링
        function renderPagination() {
            let targetData = [];
            const isFilterActive = (searchQuery || startDate || endDate || selectedCountry);

            if (isFilterActive) {
                targetData = filteredNews;
            }else{
                targetData = allSignals
            }


            const paginationContainer = document.getElementById('pagination');
            if (!paginationContainer) return;

            // URL 기준 중복 제거
            const uniqueSignals = Array.from(
                new Map(targetData.map(item => [item.url, item])).values()
            );
            // 중복 제거된 데이터 기준으로 페이지 계산
            const totalPages = Math.ceil(uniqueSignals.length / SIGNALS_PER_PAGE);
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="handlePageChange(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage === i ? 'bg-blue-600 text-white' : 'hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button onclick="handlePageChange(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            `;

            paginationContainer.innerHTML = html;
            lucide.createIcons(); // 아이콘 재생성
        }

        // 이벤트 핸들러
        function handlePageChange(page) {

            let targetData;

            // 필터 활성 여부 확인
            const isFilterActive =
                searchQuery || startDate || endDate || selectedCountry;

            // 필터가 켜져 있으면 filteredNews 사용
            if (isFilterActive) {
                targetData = filteredNews;
            } else {
                targetData = allSignals;
            }

            // URL 기준 중복 제거
            const uniqueSignals = Array.from(
                new Map(targetData.map(item => [item.url, item])).values()
            );

            const totalPages = Math.ceil(uniqueSignals.length / SIGNALS_PER_PAGE);
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderNews();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 현재 브라우저의 파일명만 추출
            const currentPath = window.location.pathname.split("/").pop() || "main.html";
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                // href 속성값에서 파일명만 가져와서 비교
                const itemHref = item.getAttribute('href').split("/").pop();

                if (currentPath === itemHref) {
                    if (item.querySelector('i')) {
                        item.classList.replace('text-gray-600', 'text-blue-600');
                        item.classList.add('bg-blue-50');
                    } else {
                        item.classList.remove('text-gray-600', 'hover:bg-gray-50');
                        item.classList.add('bg-gradient-to-br', 'from-blue-600', 'to-blue-800', 'text-white');
                    }
                }
            });

            if (window.lucide) lucide.createIcons();
        });

        // 히트맵 갱신 시간 함수 - 매일 자정 / 정오 시간으로 갱신
        function updateRefreshTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');

            // 현재 시간이 12시 이전이면 '00:00', 12시 이후면 '12:00'로 표기
            const hours = now.getHours() >= 12 ? '12:00' : '00:00';

            // YYYY-MM-DD HH:mm 갱신 형태로 포맷팅
            const formattedTime = `${year}-${month}-${date} ${hours} 갱신`;

            // DOM에 반영
            const timeTag = document.getElementById('update-time-tag');
            if (timeTag) {
                timeTag.innerText = formattedTime;
            }
        }

        function scheduleNextUpdate() {
            const now = new Date();
            const nextUpdate = new Date();

            // 다음 정오(12시) 또는 자정(24시=다음날 00시) 계산
            if (now.getHours() < 12) {
                // 현재 오전이면 -> 오늘 정오(12시)가 다음 갱신 타겟
                nextUpdate.setHours(12, 0, 0, 0);
            } else {
                // 현재 오후면 -> 다음날 자정(00시)이 다음 갱신 타겟
                nextUpdate.setDate(now.getDate() + 1);
                nextUpdate.setHours(0, 0, 0, 0);
            }

            // 다음 갱신 시점까지 남은 밀리초(ms) 계산
            const timeUntilNextUpdate = nextUpdate - now;

            // 첫 번째 타이머: 정확히 자정/정오가 되는 순간 실행
            setTimeout(() => {
                updateRefreshTime(); // 텍스트 갱신

                // 두 번째 타이머: 그 이후부터는 정확히 12시간(43,200,000ms)마다 반복 실행
                setInterval(updateRefreshTime, 12 * 60 * 60 * 1000);
            }, timeUntilNextUpdate);
        }



        // 🎯 [완전체] 데이터 추적 + 페이지네이션 전환 + 렌더링 동기화 완벽 결합
        async function executeScrollToCard() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#signal-')) return;

            const targetId = hash.replace('#signal-', '');
            // 💡 [추가] 156번이 전체 데이터에는 있는지, 필터 데이터에는 없는지 확인
            const existsInAll = allSignals.find(s => String(s.signal_no) === String(targetId));
            const existsInFiltered = filteredNews.find(s => String(s.signal_no) === String(targetId));

            console.log("🔍 [진단] 타겟:", targetId);
            console.log("🔍 전체 데이터에 존재?", !!existsInAll);
            console.log("🔍 필터링 데이터에 존재?", !!existsInFiltered);
            // ----------------------------------------------------------------
            // 1. 데이터가 로드될 때까지 0.1초씩 재시도 (비동기 데이터 보호)
            if (!allSignals || allSignals.length === 0) {
                setTimeout(executeScrollToCard, 100);
                return;
            }

            // renderNews와 동일한 데이터 흐름 사용
            const uniqueSignals = Array.from(
                new Map(allSignals.map(item => [item.url, item])).values()
            );

            const sortedSignals = uniqueSignals.sort((a, b) => {

                if (a.risk_score !== b.risk_score) {
                    return a.risk_score - b.risk_score;
                }

                return new Date(b.published_date) - new Date(a.published_date);
            });

            // 실제 렌더링 기준 데이터에서 위치 찾기
            let targetIndex = sortedSignals.findIndex(
                s => String(s.signal_no) === String(targetId)
            );

            // 💥 핵심 패치
            if (targetIndex === -1) {
                console.log("⚠️ 현재 필터에 없음 → 전체 보기로 자동 복구");


<!--                // 버튼 UI도 전체 상태로 복구-->
<!--                document.querySelectorAll('#filter-container button').forEach(btn => {-->
<!--                    const btnText = btn.innerText;-->

<!--                    if (btnText === '전체') {-->
<!--                        btn.className =-->
<!--                            "px-4 py-2 rounded-lg bg-gray-900 text-white font-bold shadow-md transition-all";-->
<!--                    } else if (btnText.includes('심각')) {-->
<!--                        btn.className =-->
<!--                            "px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-colors";-->
<!--                    } else if (btnText.includes('주의')) {-->
<!--                        btn.className =-->
<!--                            "px-5 py-2 rounded-lg bg-yellow-50 text-yellow-600 hover:bg-yellow-100 transition-colors";-->
<!--                    } else if (btnText.includes('안정')) {-->
<!--                        btn.className =-->
<!--                            "px-5 py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors";-->
<!--                    }-->
<!--                });-->

                applyFilters();

                const filteredUniqueSignals = Array.from(
                    new Map(filteredNews.map(item => [item.url, item])).values()
                );

                const filteredSortedSignals = filteredUniqueSignals.sort((a, b) => {

                    if (a.risk_score !== b.risk_score) {
                        return a.risk_score - b.risk_score;
                    }

                    return new Date(b.published_date) - new Date(a.published_date);
                });

                targetIndex = filteredSortedSignals.findIndex(
                    s => String(s.signal_no) === String(targetId)
                );
            }

            if (targetIndex !== -1) {
                const targetPage = Math.ceil((targetIndex + 1) / SIGNALS_PER_PAGE);

                // 페이지 이동 필요 시
                if (currentPage !== targetPage) {
                    currentPage = targetPage;
                    renderNews();
                    renderPagination();

                    await new Promise(resolve =>
                        requestAnimationFrame(() =>
                            requestAnimationFrame(resolve)
                        )
                    );
                }

                // DOM 렌더링 완료 후 카드 찾기
                const targetCard = document.getElementById(`signal-${targetId}`);

                if (targetCard) {
                    targetCard.scrollIntoView({
                        behavior: 'smooth',

                    });

                    targetCard.classList.add(
                        'ring-4',
                        'ring-blue-500',
                        'shadow-[0_0_25px_rgba(59,130,246,0.8)]',
                        'transition-all',
                        'duration-500'
                    );

                    setTimeout(() => {
                        targetCard.classList.remove(
                            'ring-4',
                            'ring-blue-500',
                            'shadow-[0_0_25px_rgba(59,130,246,0.8)]'
                        );

                        history.replaceState(null, null, window.location.pathname);

                        hasPendingScroll = false;
                    }, 2000);
                } else {
                    console.log("❌ 카드 DOM 못 찾음:", targetId);
                }
            }
