        <style>
            /* 지도 내 국가 호버 효과 */

                opacity: 0.8;

            }

            .notif-container {
                position: relative;

                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            .notif-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;           /* 적절한 클릭 영역 */
                transition: all 0.2s;   /* 부드러운 hover 효과 */

                border: none;           /* 기본 보더 제거 */
                background: none;       /* 기본 배경 제거 */
                cursor: pointer;
            }

            .notif-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background-color: #ef4444; /* red-500 */
                color: white;
                font-size: 10px;
                font-weight: bold;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                align-items: center;
                justify-content: center;
                border: 2px solid white; /* 버튼 배경과 구분되도록 흰색 테두리 추가 */
            }

            /* 드롭다운 본체 */
            .notif-dropdown {
                position: absolute;
                right: 0;
                top: calc(100% + 8px);
                width: 350px;
                background-color: white;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem; /* rounded-xl */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                z-index: 9999 !important;
            }

            .hidden { display: none; }

            /* 헤더 */
            .notif-header {
                padding: 16px;
                border-bottom: 1px solid #f3f4f6;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-title { font-size: 16px; font-weight: bold; color: #111827; }
            .header-count { font-size: 13px; color: #6b7280; }

            /* 알림 목록 */
            .notif-body {
                max-height: 400px;
                overflow-y: auto;
            }

            .notif-item {
                padding: 16px;
                display: flex;
                gap: 12px;
                border-bottom: 1px solid #f3f4f6;
                cursor: pointer;
                transition: background-color 0.2s;
                position: relative;
            }

            .notif-item:hover { background-color: #f9fafb; }
            .notif-item.unread { background-color: #eff6ff; }

            /* 아이콘 박스 */
            .icon-wrapper {
                width: 40px;
                height: 40px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .type-signal { background-color: #fee2e2; color: #dc2626; }
            .type-keyword { background-color: #dbeafe; color: #2563eb; }
            .type-profile { background-color: #f3f4f6; color: #4b5563; }

            .content-wrapper { flex: 1; }
            .item-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 2px; }
            .item-msg { font-size: 13px; color: #4b5563; line-height: 1.4; }
            .item-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .item-time { font-size: 12px; color: #9ca3af; }
            .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }

            /* 삭제 버튼 */
            .delete-btn {
                background: none;
                border: none;
                color: #d1d5db;
                padding: 4px;
                cursor: pointer;
                height: fit-content;
            }

            .delete-btn:hover { color: #9ca3af; }

            /* 푸터 */

                border: none;
                color: #2563eb;

                font-weight: 500;
                cursor: pointer;

    <script>
        // --- 1. 전역 상태 관리 ---

        let selectedCountry = null;
        let startDate = null;
        let endDate = null;

        let calendarMonth = new Date(2026, 4); // 2026년 5월
        let chartDom = document.getElementById('map');
        let myChart = echarts.init(chartDom);
        let noti = [];
        const SIGNALS_PER_PAGE = 10;
        let currentPage = 1;

        const countryNamesKOR = {
            "United States": "미국", "China": "중국", "Japan": "일본", "Korea": "대한민국",
            "Russia": "러시아", "India": "인도", "Iran": "이란", "Israel": "이스라엘",
            "Saudi Arabia": "사우디아라비아", "UAE": "아랍에미리트", "Qatar": "카타르",
            "Iraq": "이라크", "Egypt": "이집트", "Turkey": "튀르키예", "Syria": "시리아",
            "Ukraine": "우크라이나", "United Kingdom": "영국", "France": "프랑스",
            "Germany": "독일", "Italy": "이탈리아", "Vietnam": "베트남",
            "Indonesia": "인도네시아", "ASEAN": "동남아시아", "EU": "유럽연합"
        };
        let dateFilter = "";

        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });
        }

        // 페이지 오픈시 실행
        document.addEventListener('DOMContentLoaded', async() => {
            axios.get("/session_out");
            updateNavbar();
            await fetchMainData();
            renderExchangeRates();
            initCalendar();
            lucide.createIcons();
            updateNotifUI();
            renderNews();
            renderPagination();
            updateStation();

        // 환율/원자재 라벨링 3[서버에서 데이터 로드]
        // --- 2. 데이터 통합 로드 (백엔드 API 호출) ---
        async function fetchMainData() {
            try {
                const [riskRes, indicatorRes, heatmapRes] = await Promise.all([
                    // axios.get('/api/risk-signals'),
                    axios.get("/public_signals"),
                    axios.get('/api/market-indicators'),
                    axios.get('/main/country') 
                ]);
                console.log(riskRes, indicatorRes, heatmapRes);
                allSignals = riskRes.data.msg;
                const rawHeatmapData = heatmapRes.data;

                heatmapData = rawHeatmapData.country_signal.map(item => {
                    let visualValue, level;
                    const score = item.total_score;
                    
                    // 요청하신 점수 기준 로직
                    if (score >= 300) {
                        visualValue = 3; // 빨간색 (심각)
                        level = "심각";
                    } else if (score >= 200) {
                        visualValue = 2; // 노란색 (주의)
                        level = "주의";
                    } else {
                        visualValue = 1; // 초록색 (안정)
                        level = "안정";
                    }
                    
                    return {
                        name: item.en_name,    // 국가 영문명
                        value: visualValue,    // 차트 색상 결정용 (1, 2, 3)
                        total_score: score,    // 실제 점수
                        level: level           // 가공된 등급명 (심각, 주의, 안정)
                    };
                });
                // console.log('Heatmap Data:', heatmapData);
                if (indicatorRes.data.status === "success") {
                    renderExchangeRates(indicatorRes.data.data);
                }
            }catch (error) {
                    console.error(error);
            }
        }

        // Navbar 상태 업데이트
        function updateNavbar() {

            const userNameSpan = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');
            // console.log(`${loggedInId} / ${userNameSpan} / ${userGreeting}`);

        const trigger = document.getElementById('notifTrigger');
        const dropdown = document.getElementById('notifDropdown');
        const list = document.getElementById('notifList');

        // 토글 이벤트
        trigger.addEventListener('click', (e) => {

        // 외부 클릭 시 닫기

            }
        });

        // signal 분석 시간 변화 함수(예. 방금전, 30분전, 1시간전...)
        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return '방금 전';

            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;

            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;

            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;

            // 일주일이 넘어가면 그냥 원래 날짜(년-월-일)를 보여줍니다.
            return dateString.split('T')[0];
        }

        // 알림 렌더링 함수
        async function updateNotifUI() {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const countText = document.getElementById('notifCountText');
            // 1. 로그인 여부 확인 (React 코드의 로직 반영)

            const {data} = await axios.get("/noti/signal?id="+savedUserId);
            console.log(data);
            noti = data.noti;
            // 로그인 정보가 없거나 guest인 경우 알림 목록을 표시하지 않음
            if (!savedUserId || savedUserId === "guest") {
                badge.style.display = 'none'; // 배지 숨김

                    return { ...n, is_read: 1 };
                } else {

                    return n;
                }
            });

            location.href = 'signal_log.html';

                    return { ...n, is_read: 1 };
                } else {

        // --- 5. 필터 및 검색 핸들러 (기존 로직 유지) ---

            filteredNews = allSignals.filter(item => {

                const matchSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery.toLowerCase());

                    item.published_date && 
                    (item.published_date.substring(0, 10) >= startDate) && 
                    (!endDate || item.published_date.substring(0, 10) <= endDate)
                );

        // 뉴스 렌더링 함수
        function renderNews() {
            const grid = document.getElementById('news-grid'); // 뉴스가 들어갈 컨테이너 ID
            if (!grid) return;
            let targetData = [];
            const isFilterActive = (searchQuery || startDate || endDate || selectedCountry);
            if (isFilterActive) {
                targetData = filteredNews;
            } else {
                targetData = allSignals;
            }

            const startIndex = (currentPage - 1) * SIGNALS_PER_PAGE;
            const endIndex = startIndex + SIGNALS_PER_PAGE;
            const currentSignals = targetData.slice(startIndex, endIndex);

            // 1. 리스크 단계별 테일윈드 컬러 설정
            const riskColors = {
                "안정": "bg-blue-100 text-blue-700",
                "주의": "bg-yellow-100 text-yellow-700",
                "심각": "bg-red-100 text-red-700"
            };
            
            // 2. 정렬 로직: 리스크 점수(낮은순) -> 날짜(최신순)
            const sorted = [...currentSignals].sort((a, b) => {
                // 리스크 점수 기준 정렬
                
                // 1) 실제 점수(낮은순: 심각 - 주의 - 안정 순서)
                if(a.risk_score !== b.risk_score){
                    return a.risk_score - b.risk_score
                }
                
                // 날짜 기준 정렬
                return new Date(b.published_date) - new Date(a.published_date);
                
            });
            renderPagination() 
            
            // 4. HTML 생성 및 출력
            if (sorted.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">해당하는 뉴스가 없습니다.</div>`;
                return;
            }
            
            grid.innerHTML = sorted.map(news => {
                // 음수 제거, 100 곱하기, 반올림 처리된 점수
                const displayScore = Math.round(Math.abs(100-(news.risk_score || 0) * 100));
                const displayDate = news.published_date ? news.published_date.split('T')[0] : "";

                return `
                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition-shadow group cursor-pointer h-full relative" onclick="logNewsClick('${news.url}')">
                        <a href="${news.url}" target="_blank">
                            <img src="${news.main_image || '/api/placeholder/400/320'}" alt="news" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300">
                        </a>
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <span class="px-2 py-1 text-xs font-semibold rounded ${riskColors[news.risk_level]}">
                                    ${news.risk_level}
                                </span>
                                <span class="px-2 py-1 text-xs font-semibold rounded ${riskColors[news.risk_level]}"">
                                    Signal ${displayScore}
                                </span>  
                            </div>
                            <a href="${news.url}" target="_blank" class="block font-bold leading-tight group-hover:text-blue-600 transition-colors mb-4 line-clamp-2">
                                ${news.title}
                            </a>
                            <div class="flex justify-between items-center mt-auto border-t pt-3">
                                <span class="text-xs font-bold text-blue-600 uppercase">${news.press_name}</span>
                                <span class="text-xs text-gray-400">${displayDate}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 캘린더 로직
        function toggleCalendar() {
            const dropdown = document.getElementById('calendar-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function initCalendar() {
            const container = document.getElementById('calendar-days');
            const header = document.getElementById('calendar-header');
            container.innerHTML = '';

            const year = calendarMonth.getFullYear();
            const month = calendarMonth.getMonth();
            header.innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                container.innerHTML += `<div></div>`;
            }

            for (let d = 1; d <= lastDate; d++) {
                const isToday = d === 27; // 예시용
                container.innerHTML += `
                    <button onclick="selectDate(${d})" class="p-2 text-sm rounded-lg hover:bg-blue-50 transition-colors ${isToday ? 'bg-blue-600 text-white font-bold' : ''}">
                        ${d}
                    </button>
                `;
            }
        }

        function changeMonth(step) {
            calendarMonth.setMonth(calendarMonth.getMonth() + step);
            initCalendar();
        }

        function selectDate(day) {

            const year = calendarMonth.getFullYear();
            const month = String(calendarMonth.getMonth() + 1).padStart(2, '0');
            const date = String(day).padStart(2, '0');
            const dateStr = `${year}-${month}-${date}`;

            // 시작일, 끝일 모두 선택 안됐을 때
            if (!startDate || (startDate && endDate)) {
                startDate = dateStr;
                endDate = null;
                // 여기서는 toggleCalendar()를 절대 호출하지 않습니다. (계속 열려있어야 함)
            } 
            // 시작일만 선택된 상태에서 두 번째 날짜를 클릭할 때
            else {
                if (dateStr < startDate) {
                    // 선택한 날짜가 시작일보다 빠르면 시작일을 이 날짜로 교체 (종료일은 여전히 null)
                    startDate = dateStr;
                    endDate = null;
                    // 시작일이 바뀌었을 뿐이므로 닫지 않습니다.
                } else if (dateStr === startDate) {
                    // 시작일을 한 번 더 누르면 선택 취소 (개발자 취향에 따라 선택)
                    startDate = null;
                    endDate = null;
                } else {
                    // 드디어 정상적인 종료일 선택!
                    endDate = dateStr;
                    toggleCalendar();
                }
            }
            updateDateDisplay();
            applyFilters();
        }

                display.classList.remove('text-gray-400');

        }

        // 페이지네이션 렌더링

                targetData = filteredNews;

                targetData = allSignals
            }
            // console.log(targetData.length);
            const paginationContainer = document.getElementById('pagination');

            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="handlePageChange(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            `;

                html += `
                    <button onclick="handlePageChange(${i})" class="px-4 py-2 rounded-lg border ${currentPage === i ? 'bg-blue-600 text-white' : 'hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button onclick="handlePageChange(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="p-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            `;

            paginationContainer.innerHTML = html;
            lucide.createIcons(); // 아이콘 재생성
        }

        // 이벤트 핸들러
        function handlePageChange(page) {
            
            let targetData;

            if (filteredNews && filteredNews.length > 0) {
                targetData = filteredNews;
            } else {
                targetData = allSignals;
            }
            const totalPages = Math.ceil(targetData.length / SIGNALS_PER_PAGE);

            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderNews();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 현재 브라우저의 파일명만 추출
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            const navItems = document.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                // href 속성값에서 파일명만 가져와서 비교
                const itemHref = item.getAttribute('href').split("/").pop();

                if (currentPath === itemHref) {
                    if (item.querySelector('i')) {
                        item.classList.replace('text-gray-600', 'text-blue-600');
                        item.classList.add('bg-blue-50');
                    } else {
                        item.classList.remove('text-gray-600', 'hover:bg-gray-50');
                        item.classList.add('bg-gradient-to-br', 'from-blue-600', 'to-blue-800', 'text-white');
                    }
                }
            });

            if (window.lucide) lucide.createIcons();
        });

        async function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")){
                try {
                    await axios.get("/logout");
                    sessionStorage.removeItem('savedUserId');
                    location.href = "login.html";
                }catch (error) {
                    console.error("로그아웃 중 오류 발생:", error);
                    alert("로그아웃 처리 중 문제가 발생했습니다. 다시 시도해주세요.");
                }
            }
        }

        // 바깥 클릭 시 캘린더 닫기
        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('calendar-dropdown');
            if (!dropdown.contains(e.target) && !e.target.closest('button[onclick="toggleCalendar()"]')) {
                dropdown.classList.add('hidden');
            }
        });

    </script>
</body>
</html>
