<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal - 세계 리스크 히트맵</title>
    <!-- 외부 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .country-path:hover { opacity: 0.8; cursor: pointer; }
        .notif-container { position: relative; display: inline-block; }
        .notif-dropdown { position: absolute; right: 0; top: calc(100% + 8px); width: 350px; background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 9999 !important; }
        .hidden { display: none; }
        .notif-item { padding: 16px; display: flex; gap: 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
        .unread-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <!-- 1. Navbar: 인증 및 메뉴 이동 -->
    <nav class="border-b bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-8">
                    <a href="main.html" class="flex items-center gap-2">
                        <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent pb-1">Signal</span>
                    </a>
                    <div class="hidden md:flex gap-1">
                        <a href="main.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-blue-600 bg-blue-50 font-bold">글로벌 현황</a>
                        <a href="custom_news.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">맞춤형 뉴스</a>
                        <a href="signal_log.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">시그널 로그</a>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span id="user-greeting" class="hidden text-sm text-gray-600"><span id="user_name"></span>님 반갑습니다</span>
                    <div class="notif-container" id="notifContainer">
                        <button class="notif-trigger rounded-lg hover:bg-gray-100 text-blue-600" id="notifTrigger">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                            <span class="notif-badge" id="notifBadge" style="display: none;"></span>
                        </button>
                        <div class="notif-dropdown hidden" id="notifDropdown">
                            <div class="notif-header"><span class="header-count" id="notifCountText">0개의 새 알림</span></div>
                            <div id="notifList" class="max-h-80 overflow-y-auto"></div>
                        </div>
                    </div>
                    <a href="profile.html" class="p-2 rounded-lg hover:bg-gray-100 text-blue-600"><i data-lucide="user" class="w-5 h-5"></i></a>
                    <div id="authContainer"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-3 gap-8 relative">
            <div class="lg:col-span-2">
                <!-- 2. 히트맵 영역: 국가별 위기단계 시각화 -->
                <div class="bg-white border rounded-xl p-6 mb-8 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h2 class="font-bold text-lg">세계 리스크 히트맵</h2>
                            <p id="update-time" class="text-xs text-gray-400 mt-1">데이터 로드 중...</p>
                        </div>
                        <div class="flex items-center gap-4 text-sm font-medium">
                            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#2ECC71]"></div><span>안정</span></div>
                            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#FFD400]"></div><span>주의</span></div>
                            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#FF4B4B]"></div><span>심각</span></div>
                        </div>
                    </div>
                    <div id="map" class="bg-gray-100 rounded-lg" style="height: 400px;"></div>
                    <!-- 국가 선택 시 나타나는 정보 바 -->
                    <div id="selected-country-info" class="mt-4 p-4 bg-blue-50 rounded-lg hidden flex justify-between items-center">
                        <p class="text-sm">선택된 국가: <span id="country-name" class="font-bold text-blue-700">-</span> | Signal 점수: <span id="country-score" class="font-bold">-</span></p>
                        <button onclick="resetCountryFilter()" class="text-xs text-blue-600 hover:underline">필터 해제</button>
                    </div>
                </div>

                <!-- 3. 뉴스 검색 및 필터: 검색창 + 달력 -->
                <div class="mb-6 space-y-3">
                    <h2 id="news-title" class="font-bold text-xl mb-4">오늘의 주요 뉴스</h2>
                    <div class="flex flex-col md:flex-row gap-3">
                        <div class="relative flex-1">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="search-input" oninput="handleSearch()" placeholder="키워드 또는 헤드라인 검색..."
                                class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div class="relative">
                            <button onclick="toggleCalendar()" class="w-full md:w-48 pl-10 pr-4 py-3 border rounded-lg bg-white text-left flex items-center">
                                <i data-lucide="calendar" class="absolute left-3 w-5 h-5 text-gray-400"></i>
                                <span id="date-display" class="text-sm">날짜 선택</span>
                            </button>
                            <div id="calendar-dropdown" class="absolute top-full mt-2 right-0 bg-white border rounded-xl shadow-xl p-4 z-[60] w-72 hidden">
                                <div class="flex items-center justify-between mb-4">
                                    <button onclick="changeMonth(-1)" class="p-1 hover:bg-gray-100 rounded"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                                    <div id="calendar-header" class="font-bold text-sm"></div>
                                    <button onclick="changeMonth(1)" class="p-1 hover:bg-gray-100 rounded"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                                </div>
                                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2">
                                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                                </div>
                                <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. 뉴스 그리드 -->
                <div id="news-grid" class="grid md:grid-cols-2 gap-6"></div>
                <!-- 5. 페이지네이션 (필요 시 확장용) -->
                <div id="pagination" class="mt-8 flex items-center justify-center gap-2"></div>
            </div>

            <!-- 오른쪽 사이드바: 환율 및 시그널 스테이션 -->
            <div class="lg:col-span-1">
                <div class="lg:sticky lg:top-24 space-y-6">
                    <div class="bg-white border rounded-xl p-6 shadow-sm">
                        <h3 class="mb-6 font-bold text-gray-800 flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-4 h-4 text-blue-500"></i> 실시간 환율
                        </h3>
                        <div id="exchange-rates" class="space-y-5"></div>
                    </div>

                    <div class="bg-gradient-to-br from-blue-600 to-blue-800 text-white rounded-xl p-6 shadow-lg">
                        <h3 class="mb-4 font-bold flex items-center gap-2"><i data-lucide="radio" class="w-4 h-4"></i> Signal Station</h3>
                        <p class="text-blue-100 text-xs mb-6 leading-relaxed">현재 리스크 점수가 높은 주요 국가 상황입니다.</p>
                        <div id="station-list" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 전역 상태 관리 ---
        let allSignals = [];
        let filteredNews = [];
        let selectedCountry = null;
        let selectedDate = null;
        let searchQuery = "";
        let calendarMonth = new Date(2026, 3);
        const countryNamesKOR = { "United States": "미국", "China": "중국", "Japan": "일본", "Korea": "대한민국", "Iran": "이란", "Russia": "러시아", "India": "인도" };

        const myChart = echarts.init(document.getElementById('map'));
         // 환율/원자재 라벨링 3[서버에서 데이터 로드]
        // 1. 데이터 로드: ml.py가 서버(main.py)에 받은 뉴스 데이터와 환율/원자재 데이터
        async function fetchMainData() {
            try {
                // 뉴스 데이터 가져오기
                const res = await axios.get('/api/risk-signals');
                allSignals = res.data.data;

                // 2. 시장 지표 데이터 가져오기
                const indicatorRes = await axios.get('/api/market-indicators');
                if (indicatorRes.data.status === "success") {
                    renderExchangeRates(indicatorRes.data.data);
                }

                if (allSignals && allSignals.length > 0) {
                    document.getElementById('update-time').innerText = `${new Date(allSignals[0].analyzed_at).toLocaleString()} 갱신`;
                    renderExchangeRates(allSignals[0].final_total_score.exchange_details);
                }

                applyFilters();
                renderHeatmap();
                updateStation();
            } catch (e) {
                console.error("데이터 로드 에러:", e);
            }
        }

        // 2. 통합 필터: 국가 + 검색 + 날짜 동시 처리
        function applyFilters() {
            filteredNews = allSignals.filter(item => {
                const matchCountry = !selectedCountry || item.country_name === selectedCountry;
                const matchSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery.toLowerCase());
                const matchDate = !selectedDate || item.analyzed_at.startsWith(selectedDate);
                return matchCountry && matchSearch && matchDate;
            });
            renderNewsGrid();
        }

        // 3. ECharts 지도: 위기단계별 색상 매핑
        function renderHeatmap() {
            fetch('https://raw.githubusercontent.com/apache/echarts/master/test/data/map/json/world.json')
                .then(res => res.json())
                .then(worldJson => {
                    echarts.registerMap('world', worldJson);
                    const levelMap = { "심각": 3, "주의": 2, "안정": 1 };

                    const mapData = [];
                    const processed = new Set();
                    allSignals.forEach(s => {
                        if (!processed.has(s.country_name)) {
                            mapData.push({
                                name: s.country_name,
                                value: levelMap[s.risk_level] || 1,
                                score: Math.round((s.final_total_score.total + 1) * 50)
                            });
                            processed.add(s.country_name);
                        }
                    });

                    myChart.setOption({
                        visualMap: {
                            type: 'piecewise',
                            pieces: [
                                {value: 1, label: '안정', color: '#2ECC71'},
                                {value: 2, label: '주의', color: '#FFD400'},
                                {value: 3, label: '심각', color: '#FF4B4B'}
                            ],
                            show: false
                        },
                        series: [{
                            type: 'map', map: 'world', data: mapData, roam: true,
                            emphasis: { itemStyle: { areaColor: '#f3f4f6' } },
                            selectedMode: 'single'
                        }]
                    });

                    myChart.on('click', (p) => { if (p.data) selectCountry(p.name, p.data.score); });
                });
        }

        // 4. 필터 핸들러
        function selectCountry(name, score) {
            selectedCountry = name;
            const infoBox = document.getElementById('selected-country-info');
            document.getElementById('country-name').innerText = countryNamesKOR[name] || name;
            document.getElementById('country-score').innerText = `${score}점`;
            infoBox.classList.remove('hidden');
            applyFilters();
        }

        function resetCountryFilter() {
            selectedCountry = null;
            document.getElementById('selected-country-info').classList.add('hidden');
            myChart.dispatchAction({ type: 'unSelect', seriesIndex: 0 });
            applyFilters();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            applyFilters();
        }
        // 환율/원자재 라벨링 4[위에 함수에서 데이터 가져와서 환율 가격 보여줌]
        // 5. 환율 및 뉴스 렌더링
        function renderExchangeRates(rates) {
            const container = document.getElementById('exchange-rates');
            if (!rates) {
                container.innerHTML = '<p class="text-xs text-gray-400">데이터를 불러올 수 없습니다.</p>';
                return;
            }

            // 1. 환율 데이터 구성 (위안화 추가)
            const currencies = [
                { label: '달러/KRW', val: rates.usd, key: 'USD' },
                { label: '유로/KRW', val: rates.eur, key: 'EUR' },
                { label: '엔화/KRW', val: rates.jpy, key: 'JPY' },
                { label: '위안화/KRW', val: rates.cny, key: 'CNY' } // 드디어 추가!
            ];

            // 2. 원자재 데이터 구성 (main.py에서 보낸 raw_material_score 참고)
            // 이 데이터는 allSignals[0].final_total_score.raw_material_score에 있습니다.

            container.innerHTML = currencies.map(c => `
                <div class="flex items-center justify-between border-b border-gray-50 pb-2">
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase">${c.label}</p>
                        <p class="text-lg font-bold">${c.val ? c.val.toLocaleString() : '---'}원</p>
                    </div>
                    <div class="${c.val > 1000 ? 'text-red-500' : 'text-blue-500'}">
                        <i data-lucide="trending-up" class="w-4 h-4"></i>
                    </div>
                </div>
            `).join('');

            lucide.createIcons(); // 아이콘 재생성
}
        // 뉴스 그리드 설정
        function renderNewsGrid() {
            const grid = document.getElementById('news-grid');
            const title = document.getElementById('news-title');
            title.innerText = selectedCountry ? `${countryNamesKOR[selectedCountry] || selectedCountry} 리스크 뉴스` : "오늘의 주요 뉴스";

            if (filteredNews.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center py-20 text-gray-400">일치하는 뉴스가 없습니다.</p>`;
                return;
            }

            grid.innerHTML = filteredNews.map(n => `
                <div class="bg-white border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all group cursor-pointer" onclick="location.href='custom_news.html'">
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-3">
                            <!-- 숫자 대신 서버에서 보낸 risk_status(안정/주의/위기)와 risk_color를 사용합니다 -->
                            <span class="text-[10px] font-bold px-2 py-1 rounded"
                                  style="background-color: ${n.risk_color}20; color: ${n.risk_color};">
                                ${n.risk_status} (RISK ${Math.round((n.final_total_score.total + 1) * 50)})
                            </span>
                            <span class="text-[10px] text-gray-400">${n.analyzed_at.split('T')[0]}</span>
                        </div>
                        <h4 class="font-bold text-sm leading-snug group-hover:text-blue-600 transition-colors line-clamp-2">${n.title}</h4>
                        <p class="text-[11px] text-gray-500 mt-2">${n.press_name}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateStation() {
            const list = document.getElementById('station-list');
            const top = allSignals
                .map(s => ({ name: s.country_name, score: Math.round((s.final_total_score.total + 1) * 50) }))
                .filter((v, i, a) => a.findIndex(t => t.name === v.name) === i)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);

            list.innerHTML = top.map(c => `
                <div class="flex items-center justify-between border-b border-blue-500/30 pb-2">
                    <span class="font-medium text-sm">${countryNamesKOR[c.name] || c.name}</span>
                    <span class="font-bold text-lg ${c.score > 70 ? 'text-red-300' : 'text-blue-100'}">${c.score}점</span>
                </div>
            `).join('');
        }

        // 6. 달력 기능
        function toggleCalendar() { document.getElementById('calendar-dropdown').classList.toggle('hidden'); }
        function initCalendar() {
            const container = document.getElementById('calendar-days');
            const header = document.getElementById('calendar-header');
            container.innerHTML = '';
            const y = calendarMonth.getFullYear(), m = calendarMonth.getMonth();
            header.innerText = `${y}년 ${m + 1}월`;
            const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
            for (let i = 0; i < first; i++) container.innerHTML += `<div></div>`;
            for (let d = 1; d <= last; d++) {
                const dateStr = `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                container.innerHTML += `<button onclick="selectDate('${dateStr}')" class="p-1 text-[10px] rounded hover:bg-blue-50 ${selectedDate === dateStr ? 'bg-blue-600 text-white' : ''}">${d}</button>`;
            }
        }
        function selectDate(date) {
            selectedDate = date;
            document.getElementById('date-display').innerText = date;
            toggleCalendar(); initCalendar(); applyFilters();
        }
        function changeMonth(step) { calendarMonth.setMonth(calendarMonth.getMonth() + step); initCalendar(); }

        // 7. 공통 UI (Navbar, Logout)
        function updateNavbar() {
            const id = sessionStorage.getItem('savedUserId');
            const authContainer = document.getElementById('authContainer');
            if (id && id !== 'guest') {
                document.getElementById('user-greeting').classList.remove('hidden');
                document.getElementById('user_name').innerText = id;
                authContainer.innerHTML = `<button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase">LOG OUT</button>`;
            } else {
                authContainer.innerHTML = `<a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 uppercase">LOG IN</a>`;
            }
        }
        function handleLogout() { if(confirm("로그아웃 하시겠습니까?")) { axios.get("/logout"); sessionStorage.clear(); location.href="login.html"; }}

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            fetchMainData();
            updateNavbar();
            initCalendar();
            lucide.createIcons();
            setInterval(fetchMainData, 600000); // 10분 자동 갱신
        });
    </script>
</body>
</html>
