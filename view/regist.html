<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal - 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
    <body class="bg-gray-50">

        <!-- 1. Navbar -->
        <nav class="border-b bg-white sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <div class="flex items-center gap-8">
                        <a href="main.html" class="flex items-center gap-2">
                            <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent pb-1">Signal</span>
                        </a>
                        <div class="hidden md:flex gap-1">
                            <a href="main.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">글로벌 현황</a>
                            <a href="custom_news.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">맞춤형 뉴스</a>
                            <a href="signal_log.html" class="nav-item px-4 py-2 rounded-lg transition-colors text-gray-600 hover:bg-gray-100 font-medium">시그널 로그</a>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div id="user-greeting"></div>
                        <a href="profile.html" class="p-2 rounded-lg hover:bg-gray-100 text-blue-600"><i data-lucide="user" class="w-5 h-5"></i></a>
                        <div id="authContainer">
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 2. Signup Page UI -->
        <div class="min-h-screen flex items-center justify-center px-4 py-12">
            <div class="max-w-2xl w-full">
                <div class="text-center mb-8">
                    <a href="main.html" class="mb-4 inline-block">
                        <span class="font-bold text-3xl bg-gradient-to-r from-blue-600 to-blue-800 bg-clip-text text-transparent">
                            Signal
                        </span>
                    </a>
                    <h1 class="text-2xl font-bold mb-2">회원가입</h1>
                    <p class="text-gray-600">맞춤형 무역 리스크 알림을 받아보세요</p>
                </div>

                <div class="bg-white border rounded-xl p-8 shadow-sm">
                    <form id="signup-form" class="space-y-5">
                        <!-- 아이디 중복확인 -->
                        <div>
                            <label class="block text-sm mb-2 font-medium">아이디 <span class="text-red-500">*</span></label>
                            <div class="flex gap-2">
                                <input type="text" id="id" placeholder="사용자 아이디" class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                                <button type="button" onclick="checkUsername()" class="px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors whitespace-nowrap">중복확인</button>
                            </div>
                            <div id="id_msg" class="hidden items-center gap-2 mt-2 text-sm"></div>
                        </div>

                        <!-- 비밀번호 -->
                        <div class="grid md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm mb-2 font-medium">비밀번호 <span class="text-red-500">*</span></label>
                                <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-sm mb-2 font-medium">비밀번호 확인 <span class="text-red-500">*</span></label>
                                <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <p class="text-xs text-blue-600 leading-relaxed">
                                    * 영문, 숫자를 포함한 8자리 이상으로 입력해주세요.
                                </p>
                                <p id="password-message" class="block text-xs mt-1 hidden"></p>
                            </div>
                        </div>

                        <!-- 이름 / 연락처 -->
                        <div>
                            <label class="block text-sm mb-2 font-medium">이름 <span class="text-red-500">*</span></label>
                            <input type="text" id="name" placeholder="홍길동" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm mb-2 font-medium">연락처 <span class="text-red-500">*</span></label>
                            <input type="tel" id="phone" placeholder="예시 : 12345678" maxlength="13" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            <p class="text-xs text-gray-500 mt-1">하이픈(-) 없이 숫자만 입력해주세요.</p>
                        </div>

                        <!-- 이메일 인증 -->
                        <div>
                            <label class="block text-sm mb-2 font-medium">이메일 <span class="text-red-500">*</span></label>
                            <div class="flex gap-2 mb-2">
                                <input type="email" id="email" placeholder="example@email.com" class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                                <button type="button" id="send-code-btn" onclick="sendVerificationCode()" class="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors flex items-center gap-2">
                                    <i data-lucide="mail" class="w-4 h-4"></i> 인증코드
                                </button>
                            </div>
                            <div id="verification-area" class="hidden">
                            <div class="flex gap-2">
                                <input type="text" id="verificationCode" placeholder="6자리 인증코드 입력" maxlength="6" class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <button type="button" id="verify-btn" onclick="verifyCode()" class="px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors whitespace-nowrap">인증확인</button>
                            </div>
                            <!-- 타이머 -->
                            <p id="code-timer" class="text-sm text-red-500 mt-2 hidden">인증번호 유효시간 03:00</p>
                            <!-- 재전송 -->
                            <button type="button" id="resend-btn" onclick="sendVerificationCode()" class="hidden mt-2 text-sm text-blue-600 hover:underline">
                                인증번호 재전송
                            </button>

                        </div>
                            <div id="email-msg" class="hidden items-center gap-2 mt-2 text-sm text-green-600">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> <span>이메일 인증이 완료되었습니다.</span>
                            </div>
                        </div>

                        <!-- 관심 키워드 (동적 추가/삭제) -->
                        <div class="space-y-3">
                            <label class="block text-sm font-bold text-gray-700 mb-2">
                                관심 키워드 <span class="text-red-500">*</span>
                            </label>
                            
                            <!-- 키워드들이 나열될 컨테이너 -->
                            <div id="keyword-container" class="flex flex-wrap gap-2">
                                <!-- JS에서 초기 3개를 생성하거나, 아래처럼 직접 3개를 배치할 수 있습니다. -->
                                <div class="flex gap-1 items-center">
                                    <input type="text" name="keywords[]" 
                                        class="keyword-input w-32 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                        placeholder="관심 키워드">
                                </div>
                                <div class="flex gap-1 items-center">
                                    <input type="text" name="keywords[]" 
                                        class="keyword-input w-32 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                        placeholder="관심 키워드">
                                </div>
                                <div class="flex gap-1 items-center">
                                    <input type="text" name="keywords[]" 
                                        class="keyword-input w-32 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                        placeholder="관심 키워드">
                                </div>

                                <!-- 추가 버튼 -->
                                <button type="button" onclick="addKeywordInput(event)"
                                    class="p-2 border border-blue-500 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors flex items-center justify-center">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            </div>
                            
                            <p class="text-xs text-blue-600 leading-relaxed">
                                * 단어 위주(예: 반도체, 금리)로 입력해 주세요. <br>
                                * 거시 경제, 에너지, 원자재, 전략 산업 입력을 추천드립니다.
                            </p>
                        </div>

                        <div class="flex items-start gap-2">
                            <input type="checkbox" class="mt-1" required>
                            <label class="text-sm text-gray-600">개인정보 수집 및 이용에 동의합니다. (필수)</label>
                        </div>

                        <div class="flex gap-3 pt-4">
                            <button type="button" onclick="location.href='login.html'" class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors">취소</button>
                            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors font-medium">가입하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 공통 알림 모달 -->
        <div id="alert-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
            <div class="absolute inset-0 bg-black/50"></div>
            <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 relative z-10 shadow-xl">
                <p id="modal-message" class="text-center mb-4"></p>
                <button onclick="closeModal()" class="w-full py-2 bg-blue-600 text-white rounded-md">확인</button>
            </div>
        </div>
    </body>
    <script>
        // --- 1. 전역 상태 변수 ---
        let isUsernameChecked = false;
        let isUsernameTaken = null;
        let emailVerified = false;
        let verificationTimer = null;
        let verificationExpired = false;

        // --- 2. 기능 함수 정의 ---
        function updateNavbar() {
            const authContainer = document.getElementById('authContainer');
            const userNameSpan = document.getElementById('user_name');
            const userGreeting = document.getElementById('user-greeting');
            const loggedInId = sessionStorage.getItem('savedUserId');

            if (loggedInId && loggedInId !== 'guest' && loggedInId !== 'null') {
                if (userNameSpan) userNameSpan.textContent = loggedInId;
                if (userGreeting) userGreeting.classList.remove('hidden');
                if (authContainer) {
                    authContainer.innerHTML = `<button onclick="handleLogout()" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">LOG OUT</button>`;
                }
            } else {
                if (authContainer) {
                    authContainer.innerHTML = `<a href="login.html" class="px-4 py-2 text-sm font-medium text-blue-600 rounded-lg hover:bg-gray-100 transition-colors uppercase">LOG IN</a>`;
                }
            }
            if (window.lucide) lucide.createIcons();
        }

        async function checkUsername() {
            const id = document.getElementById('id').value.trim().toLowerCase();
            const msgDiv = document.getElementById('id_msg');
            if (!id) { showModal("아이디를 입력해주세요."); return; }

            let {data} = await axios.get('/overlay?id=' + id);
            isUsernameTaken = data.msg;
            isUsernameChecked = true;

            msgDiv.classList.remove('hidden', 'text-red-600', 'text-green-600');
            msgDiv.classList.add('flex');
            if (isUsernameTaken) {
                msgDiv.classList.add('text-red-600');
                msgDiv.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i> <span>중복된 아이디입니다.</span>`;
            } else {
                msgDiv.classList.add('text-green-600');
                msgDiv.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>사용가능한 아이디입니다.</span>`;
            }
            lucide.createIcons();
        }
        // 메일 전송 함수
        async function sendVerificationCode() {
            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal("올바른 이메일 형식을 입력해주세요."); return; }

            try {
                let {data} = await axios.post("/regist/request_code", { email });
                console.log(data);
                if (data.res) {

                    verificationExpired = false;

                    document.getElementById('verification-area').classList.remove('hidden');

                    // 버튼 다시 활성화
                    const verifyBtn = document.getElementById('verify-btn');

                    verifyBtn.disabled = false;

                    verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    // 입력창 초기화
                    document.getElementById('verificationCode').value = '';

                    // 3분 타이머 시작
                    startVerificationTimer(data.expires_in || 180);

                    showModal('인증 코드가 입력하신 이메일로 발송되었습니다.');
                } else {
                    showModal(data.msg || "인증 코드 발송에 실패했습니다.");
                }
            } catch (error) {
                showModal("서버 통신 중 오류가 발생했습니다.");
            }
        }
        // 백엔드 세션과 교차 매핑하여 검증하는 함수
        async function verifyCode() {
            const inputCode = document.getElementById('verificationCode').value.trim();
            if (!inputCode) { showModal("인증코드를 입력해주세요."); return; }

            if (verificationExpired) {
                showModal("인증번호 유효시간이 만료되었습니다.");
                return;
            }

            try {
                let {data} = await axios.post("/regist/verify_code", { code: inputCode });
                if (data.res) {
                    clearInterval(verificationTimer); // 인증 성공 시 타이머 제거
                    emailVerified = true;
                    document.getElementById('verification-area').classList.add('hidden');
                    document.getElementById('send-code-btn').classList.add('hidden');
                    document.getElementById('email').disabled = true;
                    document.getElementById('email-msg').classList.remove('hidden');
                    document.getElementById('email-msg').classList.add('flex');
                    showModal("이메일 인증이 완료되었습니다.");
                } else {
                    showModal(data.msg || "인증 코드가 일치하지 않습니다.");
                }
            } catch (error) {
                showModal("코드 인증 처리 중 오류가 발생했습니다.");
            }
        }

        function addKeywordInput(event) {
            const container = document.getElementById('keyword-container');
            const addButton = event.currentTarget;
            const newDiv = document.createElement('div');
            newDiv.className = 'flex gap-1 items-center transition-all duration-300 opacity-0';
            newDiv.style.transform = 'translateY(5px)';
            newDiv.innerHTML = `
                <input type="text" name="keywords[]" class="keyword-input w-32 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="키워드 입력">
                <button type="button" onclick="removeKeywordInput(this)" class="p-1 text-gray-400 hover:text-red-500 transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>`;
            container.insertBefore(newDiv, addButton);
            requestAnimationFrame(() => { newDiv.classList.remove('opacity-0'); newDiv.style.transform = 'translateY(0)'; });
            if (window.lucide) lucide.createIcons(); // 아이콘 재생성
        }

        function removeKeywordInput(btn) {
            const target = btn.parentElement;
            target.classList.add('opacity-0');
            setTimeout(() => target.remove(), 200);
        }

        async function save(param) {
            try {
                let { data } = await axios.post('/regist', param);
                showModal("가입에 성공하였습니다!");
                setTimeout(() => { location.href = "login.html"; }, 1500);
            } catch (error) {
                showModal("회원가입 처리 중 오류가 발생했습니다.");
            }
        }
        function startVerificationTimer(seconds) {
            clearInterval(verificationTimer);
            verificationExpired = false;

            const timerEl = document.getElementById('code-timer');
            const resendBtn = document.getElementById('resend-btn');
            const verifyBtn = document.getElementById('verify-btn');

            timerEl.classList.remove('hidden');
            resendBtn.classList.add('hidden');

            let remaining = seconds;

            verificationTimer = setInterval(() => {

                const min = String(Math.floor(remaining / 60)).padStart(2, '0');
                const sec = String(remaining % 60).padStart(2, '0');

                timerEl.textContent = `인증번호 유효시간 ${min}:${sec}`;

                if (remaining <= 0) {

                    clearInterval(verificationTimer);

                    verificationExpired = true;

                    timerEl.textContent = "인증번호 유효시간이 만료되었습니다.";

                    verifyBtn.disabled = true;
                    verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');

                    resendBtn.classList.remove('hidden');

                    return;
                }

                remaining--;

            }, 1000);
        }
        function showModal(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        // --- 3. 초기화 및 리스너 ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateNavbar();

            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const messageTag = document.getElementById('password-message');

            function checkPasswordMatch() {
                const pswd = passwordInput.value;
                const confirmPswd = confirmInput.value;
                if (!pswd || !confirmPswd) { messageTag.classList.add('hidden'); return; }
                messageTag.classList.remove('hidden');
                if (pswd === confirmPswd) {
                    messageTag.textContent = "비밀번호가 일치합니다.";
                    messageTag.className = "text-xs mt-1 text-green-600";
                    confirmInput.classList.add('border-green-500'); confirmInput.classList.remove('border-red-500');
                } else {
                    messageTag.textContent = "비밀번호가 일치하지 않습니다.";
                    messageTag.className = "text-xs mt-1 text-red-600";
                    confirmInput.classList.add('border-red-500'); confirmInput.classList.remove('border-green-500');
                }
            }
            passwordInput.addEventListener('input', checkPasswordMatch);
            confirmInput.addEventListener('input', checkPasswordMatch);

            const phoneInput = document.getElementById('phone');
            phoneInput.addEventListener('input', function(e) {
                let val = this.value.replace(/[^0-9]/g, "");
                // 🌟 [핵심] 사용자가 010을 지우다가 2글자 이하로 떨어지면 아예 빈칸으로 밀어버립니다.
                if (val.length <= 2 || this.value.length < 4) {
                    // 단, 사용자가 완전히 새로 입력을 시작하는 순간(첫 글자 입력)에는 지우지 않고 통과시킵니다.
                    if (e.inputType !== "insertText") {
                        this.value = "";
                        return;
                    }
                }

                // 🌟 첫 글자를 쳐서 숫자가 생겼는데 010으로 시작하지 않는다면 자동으로 앞에 붙여줍니다.
                if (val.length > 0 && !val.startsWith("010")) {
                    val = "010" + val;
                }

                let res = "";
                
                // 2. 글자 수별 하이픈 정렬 (기존 질문자님 로직 그대로 유지)
                if (val.length < 4) {
                    res = val;
                } else if (val.length < 7) {
                    res = val.substr(0, 3) + "-" + val.substr(3);
                } else if (val.length < 11) {
                    res = val.substr(0, 3) + "-" + val.substr(3, 3) + "-" + val.substr(6);
                } else {
                    res = val.substr(0, 3) + "-" + val.substr(3, 4) + "-" + val.substr(7, 4);
                }

                this.value = res.substring(0, 13);
            });
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const pw = document.getElementById('password').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            const phoneInput = document.getElementById('phone');
            const keywords = Array.from(document.querySelectorAll('.keyword-input')).map(i => i.value.trim()).filter(k => k);
            const phoneNumber = phoneInput.value.replace(/-/g, "");

            if (!isUsernameChecked || isUsernameTaken) { showModal("아이디 중복확인을 완료해주세요."); return; }
            if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pw)) {
                showModal("비밀번호는 8자 이상이며, 영문과 숫자를 모두 포함해야 합니다.");
                return;
            }
            if (phoneNumber.length < 10) { showModal("연락처가 제대로 입력되지 않았습니다."); return; }
            if (pw !== confirmPw) { showModal("비밀번호가 일치하지 않습니다."); return; }
            if (!emailVerified) { showModal("이메일 인증을 완료해주세요."); return; }
            if (keywords.length === 0) { showModal("최소 하나 이상의 관심 키워드를 입력해주세요."); return; }

            save({ id, pw, email, phone_number: phoneNumber, keyword: keywords, user_name: name });
        });
    </script>
</body>
</html>
